<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Taska email fragments</title>
</head>
<body style="margin:0;padding:34px 16px;background-color:#f6f6f8;">
<!--
  Fragments for notification.html and invitation.html. Opening this file in a
  browser shows each fragment with sample values; the dark-mode classes (t-*)
  are declared in the <style> of the template that includes them.
-->

<!-- header(brand): logo mark built from two cells (mirrors .logo / .logo-mark in
     src/styles.css), wordmark as live text, workspace name on the right. -->
<table th:fragment="header(brand)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
<tr>
<td valign="middle" style="padding:0 0 16px 4px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td width="26" height="26" align="center" valign="middle" bgcolor="#4f46e5" th:attr="bgcolor=${brand.accent}" style="width:26px;height:26px;background-color:#4f46e5;border-radius:7px;font-size:0;line-height:0;" th:style="|width:26px;height:26px;background-color:${brand.accent};border-radius:7px;font-size:0;line-height:0;|">
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0">
<tr>
<td width="10" height="10" bgcolor="#ffffff" th:attr="bgcolor=${brand.accentFg}" style="width:10px;height:10px;background-color:#ffffff;border-radius:3px;font-size:0;line-height:0;" th:style="|width:10px;height:10px;background-color:${brand.accentFg};border-radius:3px;font-size:0;line-height:0;|">&nbsp;</td>
</tr>
</table>
</td>
<td class="t-fg" valign="middle" style="padding-left:9px;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:26px;color:#17171b;">Taska</td>
</tr>
</table>
</td>
<td th:if="${!#strings.isEmpty(brand.workspaceName)}" class="t-fg2" align="right" valign="middle" style="padding:0 4px 16px 0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:550;line-height:26px;color:#56565f;white-space:nowrap;" th:text="${brand.workspaceName}">Ozero</td>
</tr>
</table>

<!-- button(url, label, brand): bulletproof button, 11 + 17 + 11 = 39px tall. -->
<table th:fragment="button(url, label, brand)" role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td bgcolor="#4f46e5" th:attr="bgcolor=${brand.accent}" style="background-color:#4f46e5;border-radius:9px;" th:style="|background-color:${brand.accent};border-radius:9px;|"><a href="https://taska.ozero.dev/#/browse/TAS-128" th:href="${url}" style="display:inline-block;padding:11px 16px;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;line-height:17px;color:#ffffff;text-decoration:none;border-radius:9px;" th:style="|display:inline-block;padding:11px 16px;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;line-height:17px;color:${brand.accentFg};text-decoration:none;border-radius:9px;|" th:text="${label}">Open TAS-128</a></td>
</tr>
</table>

<!-- footer(text): below the card, 11.5 / 1.5, fg-2 token. -->
<table th:fragment="footer(text)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
<tr>
<td class="t-fg2" style="padding:16px 4px 0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11.5px;line-height:1.5;color:#56565f;" th:text="${text}">You're getting this because email notifications are on for your Taska account.</td>
</tr>
</table>
</body>
</html>
