server:
  port: ${NOTIFICATION_SERVER_PORT:8085}

spring:
  application:
    name: notification-service
  grpc:
    server:
      port: ${NOTIFICATION_GRPC_SERVER_PORT:9095}
  r2dbc:
    url: ${NOTIFICATION_SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5437/notification_db}
    username: ${NOTIFICATION_SPRING_R2DBC_USERNAME:taska}
    password: ${NOTIFICATION_SPRING_R2DBC_PASSWORD:taska}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${NOTIFICATION_SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5437/notification_db}
    user: ${NOTIFICATION_SPRING_LIQUIBASE_USERNAME:taska}
    password: ${NOTIFICATION_SPRING_LIQUIBASE_PASSWORD:taska}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mail:
    host: ${NOTIFICATION_MAIL_HOST:smtp.gmail.com}
    port: ${NOTIFICATION_MAIL_PORT:587}
    username: ${NOTIFICATION_MAIL_USERNAME:taskainator@gmail.com}
    password: ${NOTIFICATION_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    # Разрешает сбор метрик Prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOY_ENVIRONMENT:local}
      version: '@project.version@'

kafka:
  consumer:
    retry:
      max-attempts: ${KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      interval: ${KAFKA_CONSUMER_RETRY_INTERVAL:3s}
  consumer-group: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
  topics:
    project-events: ${NOTIFICATION_KAFKA_TOPICS_PROJECT_EVENTS:project.events}
    user-events: ${NOTIFICATION_KAFKA_TOPICS_USER_EVENTS:user.events}
    issue-events: ${NOTIFICATION_KAFKA_TOPICS_ISSUE_EVENTS:issue.events}

notification:
  delivery:
    scheduler-enabled: ${NOTIFICATION_DELIVERY_ENABLED:true}
    poll-interval: ${NOTIFICATION_DELIVERY_POLL_INTERVAL:1s}
    max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:8}
  telegram:
    enabled: ${NOTIFICATION_TELEGRAM_ENABLED:false}
    bot-username: ${NOTIFICATION_TELEGRAM_BOT_USERNAME:}
    bot-token: ${NOTIFICATION_TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${NOTIFICATION_TELEGRAM_WEBHOOK_SECRET:}
    timeout: ${NOTIFICATION_TELEGRAM_TIMEOUT:10s}
    link-ttl: ${NOTIFICATION_TELEGRAM_LINK_TTL:10m}
  app-url: ${NOTIFICATION_APP_URL:http://localhost:5173}
  brand:
    accent: ${NOTIFICATION_BRAND_ACCENT:#4f46e5}
    workspace-name: ${NOTIFICATION_BRAND_WORKSPACE_NAME:}
  invitation:
    accept-url: ${NOTIFICATION_INVITATION_ACCEPT_URL:http://localhost:5173/}
    scheduler-enabled: ${NOTIFICATION_INVITATION_EMAIL_ENABLED:true}
    poll-interval: ${NOTIFICATION_INVITATION_EMAIL_POLL_INTERVAL:5s}
  comment:
    max-shown-body-length: ${NOTIFICATION_COMMENT_MAX_SHOWN_BODY_LENGTH:100}
  email:
    retry-delay: ${NOTIFICATION_EMAIL_RETRY_DELAY:1m}

logging:
  level:
    # Telegram credentials live in the Bot API URI. Keep URL-level client logging disabled even with app DEBUG.
    reactor.netty.http.client: 'OFF'
    org.springframework.web.reactive.function.client.ExchangeFunctions: 'OFF'
    ru.taska: ${NOTIFICATION_LOG_LEVEL_ROOT:INFO}
    liquibase: ${NOTIFICATION_LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${NOTIFICATION_LOG_LEVEL_KAFKA:WARN}
