server:
  port: ${ADMIN_SERVER_PORT:8086}

spring:
  grpc:
    server:
      port: ${ADMIN_GRPC_SERVER_PORT:9097}
  r2dbc:
    url: ${ADMIN_SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5438/admin_db}
    username: ${ADMIN_SPRING_R2DBC_USERNAME:taska}
    password: ${ADMIN_SPRING_R2DBC_PASSWORD:taska}
    pool:
      initial-size: ${ADMIN_R2DBC_POOL_INITIAL_SIZE:2}
      max-size: ${ADMIN_R2DBC_POOL_MAX_SIZE:10}
      max-idle-time: ${ADMIN_R2DBC_POOL_MAX_IDLE_TIME:10m}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${ADMIN_SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5438/admin_db}
    user: ${ADMIN_SPRING_LIQUIBASE_USERNAME:taska}
    password: ${ADMIN_SPRING_LIQUIBASE_PASSWORD:taska}

# Read-only подключения к БД других сервисов.
# Локальные defaults используют user taska только для удобства разработки.
# На стенде/проде должны быть отдельные RO users (только SELECT).
admin:
  readonly:
    auth:
      url: ${ADMIN_RO_AUTH_R2DBC_URL:r2dbc:postgresql://localhost:5433/auth_db}
      username: ${ADMIN_RO_AUTH_R2DBC_USERNAME:taska}
      password: ${ADMIN_RO_AUTH_R2DBC_PASSWORD:taska}
      pool:
        initial-size: ${ADMIN_RO_AUTH_POOL_INITIAL_SIZE:2}
        max-size: ${ADMIN_RO_AUTH_POOL_MAX_SIZE:10}
        max-idle-time-minutes: ${ADMIN_RO_AUTH_POOL_MAX_IDLE_TIME_MINUTES:10}
    project:
      url: ${ADMIN_RO_PROJECT_R2DBC_URL:r2dbc:postgresql://localhost:5434/project_db}
      username: ${ADMIN_RO_PROJECT_R2DBC_USERNAME:taska}
      password: ${ADMIN_RO_PROJECT_R2DBC_PASSWORD:taska}
      pool:
        initial-size: ${ADMIN_RO_PROJECT_POOL_INITIAL_SIZE:2}
        max-size: ${ADMIN_RO_PROJECT_POOL_MAX_SIZE:10}
        max-idle-time-minutes: ${ADMIN_RO_PROJECT_POOL_MAX_IDLE_TIME_MINUTES:10}
    issue:
      url: ${ADMIN_RO_ISSUE_R2DBC_URL:r2dbc:postgresql://localhost:5436/issue_db}
      username: ${ADMIN_RO_ISSUE_R2DBC_USERNAME:taska}
      password: ${ADMIN_RO_ISSUE_R2DBC_PASSWORD:taska}
      pool:
        initial-size: ${ADMIN_RO_ISSUE_POOL_INITIAL_SIZE:2}
        max-size: ${ADMIN_RO_ISSUE_POOL_MAX_SIZE:10}
        max-idle-time-minutes: ${ADMIN_RO_ISSUE_POOL_MAX_IDLE_TIME_MINUTES:10}
    workflow:
      url: ${ADMIN_RO_WORKFLOW_R2DBC_URL:r2dbc:postgresql://localhost:5435/workflow_db}
      username: ${ADMIN_RO_WORKFLOW_R2DBC_USERNAME:taska}
      password: ${ADMIN_RO_WORKFLOW_R2DBC_PASSWORD:taska}
      pool:
        initial-size: ${ADMIN_RO_WORKFLOW_POOL_INITIAL_SIZE:2}
        max-size: ${ADMIN_RO_WORKFLOW_POOL_MAX_SIZE:10}
        max-idle-time-minutes: ${ADMIN_RO_WORKFLOW_POOL_MAX_IDLE_TIME_MINUTES:10}
    notification:
      url: ${ADMIN_RO_NOTIFICATION_R2DBC_URL:r2dbc:postgresql://localhost:5437/notification_db}
      username: ${ADMIN_RO_NOTIFICATION_R2DBC_USERNAME:taska}
      password: ${ADMIN_RO_NOTIFICATION_R2DBC_PASSWORD:taska}
      pool:
        initial-size: ${ADMIN_RO_NOTIFICATION_POOL_INITIAL_SIZE:2}
        max-size: ${ADMIN_RO_NOTIFICATION_POOL_MAX_SIZE:10}
        max-idle-time-minutes: ${ADMIN_RO_NOTIFICATION_POOL_MAX_IDLE_TIME_MINUTES:10}
    # admin (self): read-only подключение к собственной БД admin-service.
    admin:
      url: ${ADMIN_RO_ADMIN_R2DBC_URL:r2dbc:postgresql://localhost:5438/admin_db}
      username: ${ADMIN_RO_ADMIN_R2DBC_USERNAME:taska}
      password: ${ADMIN_RO_ADMIN_R2DBC_PASSWORD:taska}
      pool:
        initial-size: ${ADMIN_RO_ADMIN_POOL_INITIAL_SIZE:2}
        max-size: ${ADMIN_RO_ADMIN_POOL_MAX_SIZE:10}
        max-idle-time-minutes: ${ADMIN_RO_ADMIN_POOL_MAX_IDLE_TIME_MINUTES:10}

  # Metadata catalog: правила для каждого сервиса.
  # allow — если список непустой, в каталог попадают только эти таблицы;
  #         пустой список означает «разрешены все».
  # deny — таблицы, которые не возвращаются в каталоге (приоритет над allow).
  # sensitive-columns — колонки в формате table.column, помечаемые как секретные (флаг в ответе).
  # Менять без правки кода — только этот файл или env.
  metadata:
    services:
      auth:
        alias: auth
        schema: taska
        tables:
          allow: []
          deny:
            - databasechangelog
            - databasechangeloglock
          sensitive-columns:
            - users.password_hash
            - users.token_hash
            - users.secret_hash
            - users.refresh_token
            - users.access_token
      project:
        alias: project
        schema: taska
        tables:
          allow: []
          deny:
            - databasechangelog
            - databasechangeloglock
          sensitive-columns: []
      issue:
        alias: issue
        schema: taska
        tables:
          allow: []
          deny:
            - databasechangelog
            - databasechangeloglock
          sensitive-columns: []
      workflow:
        alias: workflow
        schema: taska
        tables:
          allow: []
          deny:
            - databasechangelog
            - databasechangeloglock
          sensitive-columns: []
      notification:
        alias: notification
        schema: taska
        tables:
          allow: []
          deny:
            - databasechangelog
            - databasechangeloglock
          sensitive-columns: []
      admin:
        alias: admin
        schema: taska
        tables:
          allow: []
          deny:
            - databasechangelog
            - databasechangeloglock
          sensitive-columns: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    ru.taska: ${ADMIN_LOG_LEVEL_ROOT:INFO}
    liquibase: ${ADMIN_LOG_LEVEL_LIQUIBASE:INFO}
