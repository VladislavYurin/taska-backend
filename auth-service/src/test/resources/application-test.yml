spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/auth_db_test
    username: test_user
    password: test_pass
  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:5432/auth_db_test
  grpc:
    server:
      port: 9090

jwt:
  secret: testSecretKeyForJWTGenerationThatIsAtLeast32BytesLong
  access-token-ttl: 5m
  refresh-token-ttl: 60m

security:
  max-failed-attempts: 5
  lock-duration: 15m
  password-encoder: bcrypt

logging:
  level:
    ru.taska: DEBUG
    liquibase: DEBUG
    org.springframework.r2dbc: DEBUG