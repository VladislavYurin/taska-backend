spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/auth_db
    username: taska
    password: taska
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5433/auth_db
    user: taska
    password: taska

jwt:
  secret: testSecretKeyForJWTGenerationThatIsAtLeast32BytesLong
  access-token-ttl: 300
  refresh-token-ttl: 3600

security:
  max-failed-attempts: 5
  lock-duration-minutes: 15

grpc:
  server:
    port: 9090
  client:
    auth-service:
      address: static://localhost:9090
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext

      # Отключаем Testcontainers
      testcontainers:
        enabled: false