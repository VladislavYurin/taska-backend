server:
  port: ${SERVER_PORT:8081}

spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/auth_db}
    username: ${SPRING_R2DBC_USERNAME:taska}
    password: ${SPRING_R2DBC_PASSWORD:taska}
    dialect: POSTGRESQL
    # R2DBC настройки пула
  r2dbc-pool:
    enabled: true
    initial-size: 10
    max-size: 20
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5433/auth_db}
    user: ${SPRING_LIQUIBASE_USERNAME:taska}
    password: ${SPRING_LIQUIBASE_PASSWORD:taska}
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9091}

app:
  kafka:
    topics:
      user-events: user.events
    outbox:
      polling-interval: 3000
      recovery-interval: 10000
      batch-size: 100
      max-attempts: 5
      processing-timeout-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true



# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-and-validation-must-be-long-enough}
  access-token-ttl: ${JWT_ACCESS_TTL:900} # 15 minutes in seconds
  refresh-token-ttl: ${JWT_REFRESH_TTL:604800} # 7 days in seconds

# Security
security:
  max-failed-attempts: 5
  lock-duration-minutes: 15
  password-encoder: ${PASSWORD_ENCODER:bcrypt} # bcrypt or argon2

logging:
  level:
    ru.taska: ${LOG_LEVEL_ROOT:INFO}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${LOG_LEVEL_KAFKA:WARN}

validation:
  # Password Policy
  password:
    min: ${PASSWORD_MIN_LEN:8}
    max: ${PASSWORD_MAX_LEN:128}
    requireUpper: ${PASSWORD_REQUIRE_UPPER:true}
    requireDigit: ${PASSWORD_REQUIRE_DIGIT:true}
    requireSpecial: ${PASSWORD_REQUIRE_SPECIAL:true}