taska:
  signup:
    enabled: ${TASKA_SIGNUP_ENABLED:false}
    ip-attempts-per-hour: ${AUTH_SIGNUP_IP_ATTEMPTS_PER_HOUR:10}

  oauth:
    ip-attempts-per-hour: ${TASKA_OAUTH_IP_ATTEMPTS_PER_HOUR:240}
    api-base-url: ${TASKA_OAUTH_API_BASE_URL:https://api.taska.ozero.dev}
    ui-base-url: ${TASKA_OAUTH_UI_BASE_URL:https://taska.ozero.dev}
    google:
      enabled: ${TASKA_OAUTH_GOOGLE_ENABLED:true}
      client-id: ${TASKA_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${TASKA_OAUTH_GOOGLE_CLIENT_SECRET:}
    github:
      enabled: ${TASKA_OAUTH_GITHUB_ENABLED:true}
      client-id: ${TASKA_OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${TASKA_OAUTH_GITHUB_CLIENT_SECRET:}
    apple:
      enabled: ${TASKA_OAUTH_APPLE_ENABLED:true}
      client-id: ${TASKA_OAUTH_APPLE_SERVICE_ID:}
      team-id: ${TASKA_OAUTH_APPLE_TEAM_ID:}
      key-id: ${TASKA_OAUTH_APPLE_KEY_ID:}
      private-key: ${TASKA_OAUTH_APPLE_PRIVATE_KEY:}

server:
  port: ${AUTH_SERVER_PORT:8081}

grpc:
  server:
    port: ${AUTH_GRPC_SERVER_PORT:9091}
  client:
    project-service:
      host: ${PROJECT_GRPC_HOST:localhost}
      port: ${PROJECT_GRPC_PORT:9096}

spring:
  application:
    name: auth-service
  r2dbc:
    url: ${AUTH_SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/auth_db}
    username: ${AUTH_SPRING_R2DBC_USERNAME:taska}
    password: ${AUTH_SPRING_R2DBC_PASSWORD:taska}
  r2dbc-pool:
    enabled: true
    initial-size: 10
    max-size: 20
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${AUTH_SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5433/auth_db}
    user: ${AUTH_SPRING_LIQUIBASE_USERNAME:taska}
    password: ${AUTH_SPRING_LIQUIBASE_PASSWORD:taska}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    topics:
      user-events: ${AUTH_KAFKA_TOPIC_USER_EVENTS:user.events}
    outbox:
      polling-interval: ${AUTH_KAFKA_OUTBOX_POLLING_INTERVAL:3s}
      recovery-interval: ${AUTH_KAFKA_OUTBOX_RECOVERY_INTERVAL:10s}
      batch-size: ${AUTH_KAFKA_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${AUTH_KAFKA_OUTBOX_MAX_ATTEMPTS:5}
      processing-timeout: ${AUTH_KAFKA_OUTBOX_PROCESSING_TIMEOUT:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    # Разрешает сбор метрик Prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOY_ENVIRONMENT:local}
      version: '@project.version@'

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-and-validation-must-be-long-enough}
  access-token-ttl: ${AUTH_JWT_ACCESS_TTL:15m}
  refresh-token-ttl: ${AUTH_JWT_REFRESH_TTL:7d}
  invite-token-ttl: ${AUTH_JWT_INVITE_TTL:7d}

security:
  max-failed-attempts: ${AUTH_SECURITY_MAX_FAILED_ATTEMPTS:5}
  lock-duration: ${AUTH_SECURITY_LOCK_DURATION:15m}
  password-encoder: ${AUTH_PASSWORD_ENCODER:bcrypt} # bcrypt or argon2

validation:
  # Password Policy
  password:
    min: ${AUTH_PASSWORD_MIN_LEN:8}
    max: ${AUTH_PASSWORD_MAX_LEN:128}
    requireUpper: ${AUTH_PASSWORD_REQUIRE_UPPER:true}
    requireDigit: ${AUTH_PASSWORD_REQUIRE_DIGIT:true}
    requireSpecial: ${AUTH_PASSWORD_REQUIRE_SPECIAL:true}

logging:
  level:
    ru.taska: ${AUTH_LOG_LEVEL_ROOT:INFO}
    liquibase: ${AUTH_LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${AUTH_LOG_LEVEL_KAFKA:WARN}

admin:
  password: ${ADMIN_PASS:changeme}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  public-url: ${STORAGE_PUBLIC_URL:http://127.0.0.1:9000}
  access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
  secret-key: ${STORAGE_SECRET_KEY:rustfsadmin}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET_AVATARS:taska-avatars}
  presigned-url-ttl: ${STORAGE_PRESIGNED_URL_TTL:15m}
  max-file-size-bytes: 2097152 # 2 MB
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/webp

invitation:
  resend-cooldown: ${AUTH_INVITATION_RESEND_COOLDOWN:1m}

directory:
  avatar-timeout: ${AUTH_DIRECTORY_AVATAR_TIMEOUT:250ms}

# Personal access token policy (TAS-400). Scope enforcement is mandatory in callers.
personal-tokens:
  max-lifetime-days: ${AUTH_PAT_MAX_LIFETIME_DAYS:90}
  max-active-tokens: ${AUTH_PAT_MAX_ACTIVE_TOKENS:10}

# Opt-in TAS-413 bridge; original opaque tokens are never accepted by gateway.
oauth-bridge:
  enabled: ${AUTH_OAUTH_ENABLED:false}
  issuer: ${OAUTH_ISSUER:}
  resource: ${MCP_OAUTH_RESOURCE:}
  introspection-uri: ${OAUTH_INTROSPECTION_URL:}
  grant-validation-uri: ${OAUTH_GRANT_VALIDATION_URL:}
  introspection-client-id: ${OAUTH_INTROSPECTION_CLIENT_ID:auth-service}
  introspection-secret: ${OAUTH_INTROSPECTION_SECRET:}
  identity-service-credential: ${OAUTH_IDENTITY_SERVICE_CREDENTIAL:}
  mcp-exchange-credential: ${MCP_OAUTH_EXCHANGE_CREDENTIAL:}
  delegation-signing-secret: ${OAUTH_DELEGATION_SIGNING_SECRET:}
