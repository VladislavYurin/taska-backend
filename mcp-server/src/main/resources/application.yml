server:
  port: ${MCP_SERVER_PORT:8080}
spring:
  application:
    name: mcp-server
  http:
    codecs:
      max-in-memory-size: ${MCP_MAX_REQUEST_BYTES:65536}
  ai:
    mcp:
      server:
        name: taska
        version: '@project.version@'
        protocol: STATELESS
        type: ASYNC
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,gateway
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOY_ENVIRONMENT:local}
      version: '@project.version@'
taska:
  mcp:
    gateway-signing-secret: ${MCP_GATEWAY_SIGNING_SECRET:}
    transport:
      max-request-bytes: ${MCP_MAX_REQUEST_BYTES:65536}
    quota:
      token-read: ${MCP_TOKEN_READ_PER_MINUTE:120}
      token-write: ${MCP_TOKEN_WRITE_PER_MINUTE:20}
      user-read: ${MCP_USER_READ_PER_MINUTE:240}
      user-write: ${MCP_USER_WRITE_PER_MINUTE:40}
      token-concurrent: ${MCP_TOKEN_CONCURRENT:4}
      user-concurrent: ${MCP_USER_CONCURRENT:8}
      max-tokens: ${MCP_MAX_TRACKED_TOKENS:10000}
      max-users: ${MCP_MAX_TRACKED_USERS:10000}
      idle-ttl: ${MCP_QUOTA_IDLE_TTL:5m}
    tools:
      timeout: ${MCP_TOOL_TIMEOUT:20s}
      max-result-bytes: ${MCP_MAX_RESULT_BYTES:131072}
      text-limit: 4000
      max-text-limit: 8192
    gateway-url: ${MCP_GATEWAY_URL:http://localhost:8080}
    connect-timeout: ${MCP_CONNECT_TIMEOUT:2s}
    response-timeout: ${MCP_RESPONSE_TIMEOUT:5s}
    max-response-bytes: ${MCP_MAX_RESPONSE_BYTES:2097152}
    allowed-origins: ${MCP_ALLOWED_ORIGINS:http://localhost:6274,http://127.0.0.1:6274}
    auth:
      host: ${AUTH_GRPC_HOST:localhost}
      port: ${AUTH_GRPC_PORT:9091}
      deadline: ${AUTH_GRPC_DEADLINE:3s}
logging:
  level:
    ru.taska: ${MCP_LOG_LEVEL:INFO}
    # SDK initialize logging includes untrusted client metadata; do not log it by default.
    io.modelcontextprotocol: WARN
