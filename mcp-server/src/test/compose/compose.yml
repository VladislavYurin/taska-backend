{
  "services": {
    "database": {
      "image": "postgres:16",
      "environment": {
        "POSTGRES_USER": "taska",
        "POSTGRES_PASSWORD": "taska"
      },
      "tmpfs": [
        "/var/lib/postgresql/data"
      ],
      "volumes": [
        "./init-databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U taska -d auth_db"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 40
      }
    },
    "kafka": {
      "image": "apache/kafka:3.9.1",
      "environment": {
        "KAFKA_HEAP_OPTS": "-Xms128m -Xmx256m",
        "KAFKA_NODE_ID": "1",
        "KAFKA_PROCESS_ROLES": "broker,controller",
        "KAFKA_CONTROLLER_QUORUM_VOTERS": "1@kafka:9093",
        "KAFKA_LISTENERS": "PLAINTEXT://:9092,CONTROLLER://:9093",
        "KAFKA_ADVERTISED_LISTENERS": "PLAINTEXT://kafka:9092",
        "KAFKA_CONTROLLER_LISTENER_NAMES": "CONTROLLER",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "1",
        "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS": "0"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"
        ],
        "interval": "3s",
        "timeout": "5s",
        "retries": 40
      }
    },
    "storage": {
      "image": "rustfs/rustfs:1.0.0-rc.6",
      "environment": {
        "RUSTFS_ACCESS_KEY": "e2e-only-access",
        "RUSTFS_SECRET_KEY": "e2e-only-secret"
      },
      "command": [
        "server",
        "/data"
      ],
      "tmpfs": [
        "/data:mode=1777"
      ]
    },
    "auth-service": {
      "image": "${TASKA_E2E_JRE_IMAGE:-eclipse-temurin:21-jre}",
      "user": "1000:1000",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2",
        "SERVER_PORT": "8080",
        "SPRING_GRPC_SERVER_PORT": "9090",
        "DEPLOY_ENVIRONMENT": "mcp-e2e",
        "SPRING_R2DBC_USERNAME": "taska",
        "SPRING_R2DBC_PASSWORD": "taska",
        "SPRING_LIQUIBASE_USER": "taska",
        "SPRING_LIQUIBASE_PASSWORD": "taska",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka:9092",
        "JWT_SECRET": "${TASKA_E2E_JWT_SECRET:?generated by test}",
        "MCP_GATEWAY_SIGNING_SECRET": "${TASKA_E2E_SIGNING_SECRET:?generated by test}",
        "STORAGE_ENDPOINT": "http://storage:9000",
        "STORAGE_PUBLIC_URL": "http://storage:9000",
        "STORAGE_ACCESS_KEY": "e2e-only-access",
        "STORAGE_SECRET_KEY": "e2e-only-secret",
        "STORAGE_REGION": "us-east-1",
        "STORAGE_BUCKET_AVATARS": "e2e-avatars",
        "STORAGE_BUCKET_ATTACHMENTS": "e2e-attachments",
        "NOTIFICATION_TELEGRAM_ENABLED": "false",
        "NOTIFICATION_DELIVERY_ENABLED": "false",
        "NOTIFICATION_INVITATION_EMAIL_ENABLED": "false",
        "NOTIFICATION_MAIL_HOST": "127.0.0.1",
        "NOTIFICATION_MAIL_PORT": "9",
        "NOTIFICATION_MAIL_USERNAME": "",
        "NOTIFICATION_MAIL_PASSWORD": "",
        "SPRING_MAIL_TEST_CONNECTION": "false",
        "SPRING_MAIN_BANNER_MODE": "off",
        "LOGGING_LEVEL_ORG_APACHE_KAFKA": "ERROR",
        "LOGGING_LEVEL_LIQUIBASE": "WARN",
        "LOGGING_LEVEL_ROOT": "WARN",
        "LOGGING_LEVEL_RU_TASKA": "INFO",
        "AUTH_GRPC_HOST": "auth-service",
        "AUTH_GRPC_PORT": "9090",
        "PROJECT_GRPC_HOST": "project-service",
        "PROJECT_GRPC_PORT": "9090",
        "WORKFLOW_GRPC_HOST": "workflow-service",
        "WORKFLOW_GRPC_PORT": "9090",
        "ISSUE_GRPC_HOST": "issue-service",
        "ISSUE_GRPC_PORT": "9090",
        "NOTIFICATION_GRPC_HOST": "notification-service",
        "NOTIFICATION_GRPC_PORT": "9090",
        "ADMIN_GRPC_HOST": "admin-service",
        "ADMIN_GRPC_PORT": "9090",
        "MCP_GATEWAY_URL": "http://api-gateway:8080",
        "SPRING_R2DBC_URL": "r2dbc:postgresql://database:5432/auth_db",
        "SPRING_LIQUIBASE_URL": "jdbc:postgresql://database:5432/auth_db"
      },
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "volumes": [
        "${TASKA_E2E_JAR_DIR:?set by test}/auth-service.jar:/app/app.jar:ro"
      ],
      "depends_on": {
        "database": {
          "condition": "service_healthy"
        },
        "kafka": {
          "condition": "service_healthy"
        }
      },
      "mem_limit": "512m",
      "ports": [
        "127.0.0.1::8080"
      ]
    },
