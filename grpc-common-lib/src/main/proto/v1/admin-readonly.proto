syntax = "proto3";

package ru.taska.admin.v1;

import "v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.taska.api.admin.v1";
option java_outer_classname = "AdminApiProto";

service AdminReadonlyService {

  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);

  rpc ListTableRows(ListTableRowsRequest) returns (ListTableRowsResponse);

  rpc GetTableRowById(GetTableRowByIdRequest) returns (GetTableRowByIdResponse);

  rpc GetProblematicOutboxEventsSummary(GetProblematicOutboxEventsSummaryRequest) returns (GetProblematicOutboxEventsSummaryResponse);
}

message GetCatalogRequest {
  ru.taska.common.v1.Header header = 1;
  GetCatalogRequestBody body = 2;
}

/**
 * Пока пустое: каталог всегда полный.
 */
message GetCatalogRequestBody {
}

message GetCatalogResponse {
  Catalog catalog = 1;
}

message Catalog {
  repeated ServiceMetadata services = 1;
}

message ServiceMetadata {
  /**
   * Ключ сервиса из конфига:
   * auth, project, issue, workflow, notification, admin.
   */
  string service_key = 1;

  /**
   * Человекочитаемый alias из admin.metadata.services.*.alias.
   */
  string alias = 2;

  repeated TableMetadata tables = 3;
}

message TableMetadata {
  string name = 1;
  repeated ColumnMetadata columns = 2;
}

message ColumnMetadata {
  string name = 1;
  /**
   * Тип из information_schema.columns.data_type.
   */
  string type = 2;
  bool primary_key = 3;
  /**
   * true, если колонка указана в sensitive-columns конфига.
   */
  bool sensitive = 4;
}

message ListTableRowsRequest {
  ru.taska.common.v1.Header header = 1;
  ListTableRowsRequestBody body = 2;
}

message ListTableRowsRequestBody {
  string service_key = 1;
  string table_name = 2;
  optional int32 page = 3;
  optional int32 page_size = 4;
  optional string sort = 5;
  optional string order = 6;
  map<string, string> filters = 7;
}

message ListTableRowsResponse {
  repeated Row rows = 1;
  PaginationInfo pagination = 2;
  MetaInfo meta = 3;
}

message Row {
  map<string, Value> fields = 1;
}

message Value {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    int64 timestamp_value = 5;
    bool null_value = 6;
  }
}

message PaginationInfo {
  int32 current_page = 1;
  int32 page_size = 2;
  int64 total_rows = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message GetTableRowByIdRequest {
  ru.taska.common.v1.Header header = 1;
  GetTableRowByIdRequestBody body = 2;
}

message GetTableRowByIdRequestBody {
  string service_key = 1;
  string table_name = 2;
  string id = 3;
}

message GetTableRowByIdResponse {
  Row row = 1;
}

message GetProblematicOutboxEventsSummaryRequest {
  ru.taska.common.v1.Header header = 1;
  GetProblematicOutboxEventsSummaryRequestBody body = 2;
}

message GetProblematicOutboxEventsSummaryRequestBody {
  optional string service_key = 1;
}

message GetProblematicOutboxEventsSummaryResponse {
  repeated ProblematicOutboxEventDto events = 1;
  repeated ProblematicEventCountsByService counts = 2;
  bool not_all_shown = 3;
}

message ProblematicEventCountsByService {
  string service_key = 1;
  int64 overdue_new_count = 2;
  int64 stuck_processing_count = 3;
  int64 failed_count = 4;
}

message ProblematicOutboxEventDto {
  string id = 1;
  string aggregate_type = 2;
  string aggregate_id = 3;
  string event_type = 4;
  string payload = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp published_at = 8;
  int32 attempts = 9;
  optional string last_error_message = 10;
  optional google.protobuf.Timestamp processing_started_at = 11;
  optional string request_id = 12;
  string service_key = 13;
  string reason = 14;
}

message MetaInfo {
  string service_key = 1;
  string table_name = 2;
  repeated string columns = 3;
  repeated string sortable_columns = 4;
  repeated string filterable_columns = 5;
}