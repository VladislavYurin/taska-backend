syntax = "proto3";

package ru.taska.workflow.v1;

import "v1/common.proto";

option java_multiple_files = true;
option java_package = "ru.taska.api.workflow.v1";
option java_outer_classname = "WorkflowApiProto";

enum IssueType {
  ISSUE_TYPE_UNSPECIFIED = 0;
  ISSUE_TYPE_TASK = 1;
  ISSUE_TYPE_BUG = 2;
  ISSUE_TYPE_STORY = 3;
}

/**
 * Логическая категория статуса для группировки и семантической интерпретации.
 */
enum StatusCategory {
  STATUS_CATEGORY_UNSPECIFIED = 0;
  STATUS_CATEGORY_TODO = 1;
  STATUS_CATEGORY_IN_PROGRESS = 2;
  STATUS_CATEGORY_DONE = 3;
}

service WorkflowService {
  /**
   * Возвращает workflow, привязанный к (project_id, issue_type).
   */
  rpc GetWorkflowForProject(GetWorkflowForProjectRequest)
      returns (WorkflowResponse);

  /**
   * Валидирует переход по workflow.
   */
  rpc ValidateTransition(ValidateTransitionRequest)
      returns (ValidateTransitionResponse);

  /**
   * Создаёт новый workflow с набором статусов и переходов.
   */
  rpc CreateWorkflow(CreateWorkflowRequest)
      returns (WorkflowResponse);
}

message GetWorkflowForProjectRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  GetWorkflowForProjectRequestBody body = 2;
}

message GetWorkflowForProjectRequestBody {
  /**
   * Идентификатор проекта.
   */
  string project_id = 1;

  /**
   * Тип задачи (например: TASK / BUG / STORY).
   */
  IssueType issue_type = 2;

  /**
   * Идентификатор текущего пользователя
   */
  string actor_user_id = 3;
}

/**
 * Ответ с данными workflow.
 */
message WorkflowResponse {
  /**
   * Идентификатор Workflow.
   */
  string id = 1;

  /**
   * Отображаемое имя workflow в UI.
   */
  string name = 2;

  /**
   * Версия workflow.
   * Может использоваться для эволюции конфигурации
   * и обеспечения обратной совместимости.
   */
  int32 version = 3;

  /**
   * Временная метка создания записи (аудит).
   */
  string created_at = 4;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  string updated_at = 5;

  /**
   * Статусы workflow.
   */
  repeated WorkflowStatus statuses = 6;

  /**
   * Переходы workflow.
   */
  repeated WorkflowTransition transitions = 7;
}

message WorkflowStatus {
  /**
   * Идентификатор статуса.
   */
  string id = 1;

  /**
   * Стабильный ключ статуса, используемый другими сервисами и в снимках состояния (snapshot).
   * Пример: TODO / IN_PROGRESS / DONE.
   */
  string status_key = 2;

  /**
   * Отображаемое имя статуса в пользовательском интерфейсе.
   */
  string name = 3;

  /**
   * Логическая категория статуса для группировки и семантической интерпретации.
   * Пример: TODO / IN_PROGRESS / DONE.
   */
  StatusCategory category = 4;

  /**
   * Определяет порядок отображения статусов внутри workflow (например, порядок колонок на доске).
   */
  int32 sort_order = 5;

  /**
   * Временная метка создания записи (аудит).
   */
  string created_at = 6;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  string updated_at = 7;
}

message WorkflowTransition {
  /**
   * Идентификатор перехода (Transition).
   */
  string id = 1;

  /**
   * Идентификатор исходного статуса (текущее состояние задачи).
   */
  string from_status_id = 2;

  /**
   * Идентификатор целевого статуса (состояние задачи после перехода).
   */
  string to_status_id = 3;

  /**
   * Отображаемое имя действия в UI.
   */
  string name = 4;

  /**
   * Определяет порядок отображения переходов,
   * если из одного статуса доступно несколько вариантов.
   */
  int32 sort_order = 5;

  /**
   * Временная метка создания записи (аудит).
   */
  string created_at = 6;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  string updated_at = 7;
}

message ValidateTransitionRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ValidateTransitionRequestBody body = 2;
}

message ValidateTransitionRequestBody {
  /**
   * Снимок задачи с необходимыми полями для валидации перехода по workflow.
   */
  IssueValidateSnapshot issue_snapshot = 1;

  /**
   * Идентификатор перехода по workflow.
   */
  string transition_id = 2;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 3;

  /**
   * Дополнительные данные для перехода.
   */
  optional string payload = 4;
}

message IssueValidateSnapshot {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 1;

  /**
   * Идентификатор проекта.
   */
  string project_id = 2;

  /**
   * Тип задачи.
   */
  IssueType issue_type = 3;

  /**
   * Текущий статус задачи.
   */
  string status_key = 4;
}

message ValidateTransitionResponse {
  /**
   * Заголовок ответа.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело ответа.
   */
  ValidateTransitionResponseBody body = 2;
}

message ValidateTransitionResponseBody {
  /**
   * Разрешен ли переход по workflow.
   */
  bool is_valid = 1;

  /**
   * Целевой статус (состояние задачи после перехода).
   */
  string to_status_key = 2;

  /**
   * Список нарушений, если переход заблокирован.
   */
  repeated TransitionViolation transition_violations = 3;
}

message TransitionViolation {
  /**
   * Тип нарушения.
   */
  string transition_violation_value = 1;

  /**
   * Сообщение нарушения.
   */
  string message = 2;
}

message WorkflowStatusCreateRequest {
  /**
   * Произвольный стабильный ключ статуса. Пример: TODO / IN_PROGRESS / DONE / BACKLOG / DEV / QA
   */
  string status_key = 1;

  /**
   * Отображаемое имя статуса в пользовательском интерфейсе.
   */
  string name = 2;

  /**
   * Одна из системных категорий для группировки/семантики
   */
  StatusCategory category = 3;

  /**
   * Порядок отображения статуса внутри workflow.
   */
  int32 sort_order = 4;
}

message WorkflowTransitionCreateRequest {
  /**
   * Ключ исходного статуса.
   */
  string from_status_key = 1;

  /**
   * Ключ целевого статуса.
   */
  string to_status_key = 2;

  /**
   * Отображаемое имя перехода в пользовательском интерфейсе.
   */
  string name = 3;

  /**
   * Порядок отображения переходов.
   */
  int32 sort_order = 4;

  /**
   * Признак скрытого перехода (не отображается в UI, но доступен программно).
   */
  bool is_hidden = 5;
}

message CreateWorkflowRequestBody {
  /**
   * Идентификатор проекта.
   */
  string project_id = 1;

  /**
   * Отображаемое имя workflow.
   */
  string name = 2;

  /**
   * Типы задач, к которым применяется данный workflow.
   */
  repeated IssueType issue_types = 3;

  /**
   * Статусы, входящие в workflow.
   */
  repeated WorkflowStatusCreateRequest statuses = 4;

  /**
   * Переходы между статусами workflow.
   */
  repeated WorkflowTransitionCreateRequest transitions = 5;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   * Используется для проверки прав доступа к проекту.
   */
  string actor_user_id = 6;
}

message CreateWorkflowRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  CreateWorkflowRequestBody body = 2;
}
