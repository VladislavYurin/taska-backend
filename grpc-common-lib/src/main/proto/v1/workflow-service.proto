syntax = "proto3";

package ru.taska.workflow.v1;

import "v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "ru.taska.api.workflow.v1";
option java_outer_classname = "WorkflowApiProto";

enum IssueType {
  ISSUE_TYPE_UNSPECIFIED = 0;
  ISSUE_TYPE_TASK = 1;
  ISSUE_TYPE_BUG = 2;
  ISSUE_TYPE_STORY = 3;
}

/**
 * Логическая категория статуса для группировки и семантической интерпретации.
 */
enum StatusCategory {
  STATUS_CATEGORY_UNSPECIFIED = 0;
  STATUS_CATEGORY_TODO = 1;
  STATUS_CATEGORY_IN_PROGRESS = 2;
  STATUS_CATEGORY_DONE = 3;
}

service WorkflowService {
  // Bounded, lock-free validation for issue writers; no workflow graph is returned.
  rpc CheckProjectWorkflowScope(CheckProjectWorkflowScopeRequest) returns (google.protobuf.Empty);
  rpc CreateProjectWorkflowWithBindings(CreateWorkflowRequest) returns (WorkflowBindingOperationResult);
  rpc UpdateProjectWorkflowWithBindings(WorkflowMutationRequest) returns (WorkflowBindingOperationResult);
  rpc UpdateWorkflow(WorkflowMutationRequest) returns (ProjectWorkflow);
  rpc UpdateWorkflowStatus(WorkflowMutationRequest) returns (ProjectWorkflow);
  rpc DeleteWorkflowStatus(WorkflowMutationRequest) returns (ProjectWorkflow);
  rpc UpdateWorkflowTransition(WorkflowMutationRequest) returns (ProjectWorkflow);
  rpc DeleteWorkflowTransition(WorkflowMutationRequest) returns (ProjectWorkflow);
  rpc DeleteProjectWorkflow(WorkflowMutationRequest) returns (ProjectWorkflow);
  /**
   * Возвращает workflow, привязанный к (project_id, issue_type).
   */
  rpc GetWorkflowForProject(GetWorkflowForProjectRequest)
      returns (WorkflowResponse);

  /**
   * Валидирует переход по workflow.
   */
  rpc ValidateTransition(ValidateTransitionRequest)
      returns (ValidateTransitionResponse);

  /**
   * Создаёт новый workflow с набором статусов и переходов.
   */
  rpc CreateWorkflow(CreateWorkflowRequest)
      returns (WorkflowResponse);

  /**
   * Добавляет статус в workflow проекта.
   * Общий default workflow не меняется: проекту нужен свой workflow (CreateWorkflow).
   */
  rpc AddWorkflowStatus(AddWorkflowStatusRequest)
      returns (WorkflowResponse);

  /**
   * Добавляет переход между статусами workflow проекта.
   * Общий default workflow не меняется: проекту нужен свой workflow (CreateWorkflow).
   */
  rpc AddWorkflowTransition(AddWorkflowTransitionRequest)
      returns (WorkflowResponse);

  /**
   * Возвращает все workflow, по которым работает проект: свои и общий default,
   * с типами задач, всеми статусами и всеми переходами (включая скрытые).
   */
  rpc ListProjectWorkflows(ListProjectWorkflowsRequest)
      returns (ListProjectWorkflowsResponse);
}

message CheckProjectWorkflowScopeRequest {
  ru.taska.common.v1.Header header = 1;
  string project_id = 2;
  string actor_user_id = 3;
  repeated string issue_type_keys = 4;
  optional string expected_workflow_id = 5;
  optional int32 expected_workflow_version = 6;
  optional string status_key = 7;
}

message GetWorkflowForProjectRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  GetWorkflowForProjectRequestBody body = 2;
}

message GetWorkflowForProjectRequestBody {
  /**
   * Идентификатор проекта.
   */
  string project_id = 1;

  /**
   * Тип задачи (например: TASK / BUG / STORY).
   */
  IssueType issue_type = 2;

  /**
   * Идентификатор текущего пользователя
   */
  string actor_user_id = 3;

  // Expand-contract: key takes precedence; legacy enum remains for old clients.
  optional string issue_type_key = 4;
}

/**
 * Ответ с данными workflow.
 */
message WorkflowResponse {
  /**
   * Идентификатор Workflow.
   */
  string id = 1;

  /**
   * Отображаемое имя workflow в UI.
   */
  string name = 2;

  /**
   * Версия workflow.
   * Может использоваться для эволюции конфигурации
   * и обеспечения обратной совместимости.
   */
  int32 version = 3;

  /**
   * Временная метка создания записи (аудит).
   */
  google.protobuf.Timestamp created_at = 4;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  google.protobuf.Timestamp updated_at = 5;

  /**
   * Статусы workflow.
   */
  repeated WorkflowStatus statuses = 6;

  /**
   * Переходы workflow.
   */
  repeated WorkflowTransition transitions = 7;
  // Mutation responses also carry their project binding; old readers ignore these fields.
  repeated IssueType issue_types = 8;
  bool is_shared = 9;

  // Expand-contract: key takes precedence; legacy enum remains for old clients.
  repeated string issue_type_keys = 10;
}

message WorkflowMutationRequest {
  ru.taska.common.v1.Header header = 1;
  string project_id = 2;
  string workflow_id = 3;
  string actor_user_id = 4;
  optional int32 version = 5;
  optional string status_id = 6;
  optional string transition_id = 7;
  optional string name = 8;
  optional StatusCategory category = 9;
  optional int32 sort_order = 10;
  optional bool hidden = 11;
  optional string target_status_key = 12;
  map<string, string> status_mappings = 13;
  repeated string issue_type_keys = 14;
  bool replace_issue_types = 15; // Presence flag: false means absent; true with empty keys is invalid.
}

message WorkflowStatus {
  /**
   * Идентификатор статуса.
   */
  string id = 1;

  /**
   * Стабильный ключ статуса, используемый другими сервисами и в снимках состояния (snapshot).
   * Пример: TODO / IN_PROGRESS / DONE.
   */
  string status_key = 2;

  /**
   * Отображаемое имя статуса в пользовательском интерфейсе.
   */
  string name = 3;

  /**
   * Логическая категория статуса для группировки и семантической интерпретации.
   * Пример: TODO / IN_PROGRESS / DONE.
   */
  StatusCategory category = 4;

  /**
   * Определяет порядок отображения статусов внутри workflow (например, порядок колонок на доске).
   */
  int32 sort_order = 5;

  /**
   * Временная метка создания записи (аудит).
   */
  google.protobuf.Timestamp created_at = 6;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  google.protobuf.Timestamp updated_at = 7;
}

message WorkflowTransition {
  /**
   * Идентификатор перехода (Transition).
   */
  string id = 1;

  /**
   * Идентификатор исходного статуса (текущее состояние задачи).
   */
  string from_status_id = 2;

  /**
   * Идентификатор целевого статуса (состояние задачи после перехода).
   */
  string to_status_id = 3;

  /**
   * Отображаемое имя действия в UI.
   */
  string name = 4;

  /**
   * Определяет порядок отображения переходов,
   * если из одного статуса доступно несколько вариантов.
   */
  int32 sort_order = 5;

  /**
   * Временная метка создания записи (аудит).
   */
  google.protobuf.Timestamp created_at = 6;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  google.protobuf.Timestamp updated_at = 7;

  /**
   * Признак скрытого перехода (не отображается в UI, но доступен программно).
   * GetWorkflowForProject скрытые переходы не отдаёт, ListProjectWorkflows отдаёт все.
   */
  bool is_hidden = 8;
}

message ValidateTransitionRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ValidateTransitionRequestBody body = 2;
}

message ValidateTransitionRequestBody {
  /**
   * Снимок задачи с необходимыми полями для валидации перехода по workflow.
   */
  IssueValidateSnapshot issue_snapshot = 1;

  /**
   * Идентификатор перехода по workflow.
   */
  string transition_id = 2;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 3;

  /**
   * Дополнительные данные для перехода.
   */
  optional string payload = 4;
}

message IssueValidateSnapshot {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 1;

  /**
   * Идентификатор проекта.
   */
  string project_id = 2;

  /**
   * Тип задачи.
   */
  IssueType issue_type = 3;

  /**
   * Текущий статус задачи.
   */
  string status_key = 4;

  // Expand-contract: key takes precedence; legacy enum remains for old clients.
  optional string issue_type_key = 5;
}

message ValidateTransitionResponse {
  /**
   * Заголовок ответа.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело ответа.
   */
  ValidateTransitionResponseBody body = 2;
}

message ValidateTransitionResponseBody {
  /**
   * Разрешен ли переход по workflow.
   */
  bool is_valid = 1;

  /**
   * Целевой статус (состояние задачи после перехода).
   */
  string to_status_key = 2;

  /**
   * Список нарушений, если переход заблокирован.
   */
  repeated TransitionViolation transition_violations = 3;
}

message TransitionViolation {
  /**
   * Тип нарушения.
   */
  string transition_violation_value = 1;

  /**
   * Сообщение нарушения.
   */
  string message = 2;
}

message WorkflowStatusCreateRequest {
  /**
   * Произвольный стабильный ключ статуса. Пример: TODO / IN_PROGRESS / DONE / BACKLOG / DEV / QA
   */
  string status_key = 1;

  /**
   * Отображаемое имя статуса в пользовательском интерфейсе.
   */
  string name = 2;

  /**
   * Одна из системных категорий для группировки/семантики
   */
  StatusCategory category = 3;

  /**
   * Порядок отображения статуса внутри workflow.
   */
  int32 sort_order = 4;
}

message WorkflowTransitionCreateRequest {
  /**
   * Ключ исходного статуса.
   */
  string from_status_key = 1;

  /**
   * Ключ целевого статуса.
   */
  string to_status_key = 2;

  /**
   * Отображаемое имя перехода в пользовательском интерфейсе.
   */
  string name = 3;

  /**
   * Порядок отображения переходов.
   */
  int32 sort_order = 4;

  /**
   * Признак скрытого перехода (не отображается в UI, но доступен программно).
   */
  bool is_hidden = 5;
}

message CreateWorkflowRequestBody {
  /**
   * Идентификатор проекта.
   */
  string project_id = 1;

  /**
   * Отображаемое имя workflow.
   */
  string name = 2;

  /**
   * Типы задач, к которым применяется данный workflow.
   */
  repeated IssueType issue_types = 3;

  /**
   * Статусы, входящие в workflow.
   */
  repeated WorkflowStatusCreateRequest statuses = 4;

  /**
   * Переходы между статусами workflow.
   */
  repeated WorkflowTransitionCreateRequest transitions = 5;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   * Используется для проверки прав доступа к проекту.
   */
  string actor_user_id = 6;

  // Expand-contract: key takes precedence; legacy enum remains for old clients.
  repeated string issue_type_keys = 7;
  map<string,string> status_mappings = 8;
}

message CreateWorkflowRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  CreateWorkflowRequestBody body = 2;
}

message AddWorkflowStatusRequestBody {
  /**
   * Идентификатор проекта, которому принадлежит workflow.
   */
  string project_id = 1;

  /**
   * Идентификатор изменяемого workflow.
   */
  string workflow_id = 2;

  /**
   * Добавляемый статус.
   */
  WorkflowStatusCreateRequest status = 3;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   * Используется для проверки прав доступа к проекту.
   */
  string actor_user_id = 4;
}

message AddWorkflowStatusRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  AddWorkflowStatusRequestBody body = 2;
}

message AddWorkflowTransitionRequestBody {
  /**
   * Идентификатор проекта, которому принадлежит workflow.
   */
  string project_id = 1;

  /**
   * Идентификатор изменяемого workflow.
   */
  string workflow_id = 2;

  /**
   * Добавляемый переход. Статусы задаются ключами статусов этого workflow.
   */
  WorkflowTransitionCreateRequest transition = 3;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   * Используется для проверки прав доступа к проекту.
   */
  string actor_user_id = 4;
}

message AddWorkflowTransitionRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  AddWorkflowTransitionRequestBody body = 2;
}

message ListProjectWorkflowsRequestBody {
  /**
   * Идентификатор проекта.
   */
  string project_id = 1;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 2;
}

message ListProjectWorkflowsRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ListProjectWorkflowsRequestBody body = 2;
}

message ProjectWorkflow {
  /**
   * Workflow со всеми статусами и всеми переходами, включая скрытые.
   */
  WorkflowResponse workflow = 1;

  /**
   * Типы задач проекта, которые работают по этому workflow.
   */
  repeated IssueType issue_types = 2;

  /**
   * Общий default workflow: им пользуются все проекты без своего workflow, поэтому он не меняется.
   * Чтобы завести свои статусы и переходы, проекту нужен свой workflow (CreateWorkflow).
   */
  bool is_shared = 3;

  // Expand-contract: key takes precedence; legacy enum remains for old clients.
  repeated string issue_type_keys = 4;
}

message ListProjectWorkflowsResponse {
  /**
   * Workflow проекта, по одному на каждый различный workflow.
   */
  repeated ProjectWorkflow workflows = 1;
}

message WorkflowBindingOperationResult {
  ProjectWorkflow result = 1;
  string rejection_status = 2;
  string rejection_message = 3;
  map<string,string> rejection_details = 4;
}
