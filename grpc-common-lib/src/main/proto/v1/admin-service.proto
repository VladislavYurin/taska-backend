syntax = "proto3";

package ru.taska.admin.v1;

import "v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";


option java_multiple_files = true;
option java_package = "ru.taska.api.admin.v1";
option java_outer_classname = "AdminApiProto";

/**
 * gRPC API admin-service
 */
service AdminService {
  /**
   * Возвращает полный metadata catalog всех подключённых БД
   * с учётом denylist таблиц и флагов sensitive у колонок.
   */
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);

  rpc ListTableRows(ListTableRowsRequest) returns (ListTableRowsResponse);

  rpc GetTableRowById(GetTableRowByIdRequest) returns (GetTableRowByIdResponse);

  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
}

/**
 * Запрос на блокировку пользователя.
 */
message BlockUserRequest {
  ru.taska.common.v1.Header header = 1;
  BlockUserRequestBody body = 2;
}

/**
 * Тело запроса блокировки пользователя.
 */
message BlockUserRequestBody {
  string target_user_id = 1;
  string actor_user_id = 2;
  string actor_login = 3;
  google.protobuf.Value actor_roles = 4;
  string reason = 5;
}

/**
 * Ответ на запрос блокировки пользователя.
 */
message BlockUserResponse {
  string user_id = 1;
  ru.taska.common.v1.UserStatus previous_status = 2;
  ru.taska.common.v1.UserStatus current_status = 3;
  google.protobuf.Timestamp updated_at = 4;
}

/**
 * Запрос на разблокировку пользователя.
 */
message UnblockUserRequest {
  ru.taska.common.v1.Header header = 1;
  UnblockUserRequestBody body = 2;
}

/**
 * Тело запроса разблокировки пользователя.
 */
message UnblockUserRequestBody {
  string target_user_id = 1;
  string actor_user_id = 2;
  string actor_login = 3;
  google.protobuf.Value actor_roles = 4;
  string reason = 5;
}

/**
 * Ответ на запрос разблокировки пользователя.
 */
message UnblockUserResponse {
  string user_id = 1;
  ru.taska.common.v1.UserStatus previous_status = 2;
  ru.taska.common.v1.UserStatus current_status = 3;
  google.protobuf.Timestamp updated_at = 4;
}


message GetCatalogRequest {
  ru.taska.common.v1.Header header = 1;
  GetCatalogRequestBody body = 2;
}

/**
 * Пока пустое: каталог всегда полный.
 */
message GetCatalogRequestBody {
}

message GetCatalogResponse {
  Catalog catalog = 1;
}

message Catalog {
  repeated ServiceMetadata services = 1;
}

message ServiceMetadata {
  /**
   * Ключ сервиса из конфига:
   * auth, project, issue, workflow, notification, admin.
   */
  string service_key = 1;

  /**
   * Человекочитаемый alias из admin.metadata.services.*.alias.
   */
  string alias = 2;

  repeated TableMetadata tables = 3;
}

message TableMetadata {
  string name = 1;
  repeated ColumnMetadata columns = 2;
}

message ColumnMetadata {
  string name = 1;
  /**
   * Тип из information_schema.columns.data_type.
   */
  string type = 2;
  bool primary_key = 3;
  /**
   * true, если колонка указана в sensitive-columns конфига.
   */
  bool sensitive = 4;
}

message ListTableRowsRequest {
  ru.taska.common.v1.Header header = 1;
  ListTableRowsRequestBody body = 2;
}

message ListTableRowsRequestBody {
  string service_key = 1;
  string table_name = 2;
  optional int32 page = 3;
  optional int32 page_size = 4;
  optional string sort = 5;
  optional string order = 6;
  map<string, string> filters = 7;
}

message ListTableRowsResponse {
  repeated Row rows = 1;
  PaginationInfo pagination = 2;
  MetaInfo meta = 3;
}

message Row {
  map<string, Value> fields = 1;
}

message Value {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    int64 timestamp_value = 5;
    bool null_value = 6;
  }
}

message PaginationInfo {
  int32 current_page = 1;
  int32 page_size = 2;
  int64 total_rows = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message GetTableRowByIdRequest {
  ru.taska.common.v1.Header header = 1;
  GetTableRowByIdRequestBody body = 2;
}

message GetTableRowByIdRequestBody {
  string service_key = 1;
  string table_name = 2;
  string id = 3;
}

message GetTableRowByIdResponse {
  Row row = 1;
}

message MetaInfo {
  string service_key = 1;
  string table_name = 2;
  repeated string columns = 3;
  repeated string sortable_columns = 4;
  repeated string filterable_columns = 5;
}