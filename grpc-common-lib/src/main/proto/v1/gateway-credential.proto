syntax = "proto3";
package ru.taska.b2b.v1;
import "v1/common.proto";
import "v1/tenant-context.proto";
option java_multiple_files = true;
option java_package = "ru.taska.api.b2b.v1";
// Private credential bootstrap: mTLS-authenticated api-gateway peer only. Never log this request.
message ResolveGatewayCredentialRequest { string credential = 1; }
message GatewayCredential {
 ru.taska.common.v1.UserContext user = 1;
 // Auth-owned credential/session/grant facts; gateway adds hop/action/times and authorizes them.
 TrustedTenantContext binding = 2;
}
service GatewayCredentialService {
 rpc ResolveGatewayCredential(ResolveGatewayCredentialRequest) returns (GatewayCredential);
}
