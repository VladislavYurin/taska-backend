syntax = "proto3";
import "v1/tenant-context.proto";

package ru.taska.issue.attachment.v1;

import "v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.taska.api.issue.attachment.v1";
option java_outer_classname = "IssueAttachmentApiProto";

service IssueAttachmentService {
  rpc CreateAttachmentUploadUrl(CreateAttachmentUploadUrlRequest) returns (CreateAttachmentUploadUrlResponse);
  rpc ConfirmAttachmentUpload(ConfirmAttachmentUploadRequest) returns (AttachmentResponse);
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);
  rpc GetAttachmentDownloadUrl(GetAttachmentDownloadUrlRequest) returns (GetAttachmentDownloadUrlResponse);
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (google.protobuf.Empty);
  // Bounded version-pinned content, no object keys or S3 capabilities in the response.
  rpc ReadAttachmentContent(ReadAttachmentContentRequest) returns (ReadAttachmentContentResponse);
}

message ReadAttachmentContentRequest {
  ru.taska.b2b.v1.RequestContext context = 100;
  string actor_user_id = 1;
  string project_id = 2;
  string issue_id = 3;
  string attachment_id = 4;
  int64 offset = 5;
  int32 length = 6;
  string expected_checksum = 7;
  bool metadata_only = 8;
}
message ReadAttachmentContentResponse {
  int64 total_size = 1;
  string file_name = 2;
  string content_type = 3;
  string checksum = 4;
  int64 offset = 5;
  bytes data = 6;
}

/**
 * Данные о вложении задачи.
 */
message AttachmentResponse {
  /**
   * Идентификатор вложения.
   */
  string id = 1;

  /**
   * Идентификатор задачи, к которой прикреплено вложение.
   */
  string issue_id = 2;

  /**
   * Идентификатор пользователя, загрузившего файл.
   */
  string uploaded_by = 3;

  /**
   * Ключ объекта в файловом хранилище.
   */
  string object_key = 4;

  /**
   * Оригинальное имя файла.
   */
  string file_name = 5;

  /**
   * MIME-тип содержимого файла.
   */
  string content_type = 6;

  /**
   * Размер файла в байтах.
   */
  int64 size_bytes = 7;

  /**
   * Контрольная сумма файла.
   */
  string checksum = 8;

  /**
   * Временная метка создания записи.
   */
  google.protobuf.Timestamp created_at = 9;

  /**
   * Native: относительный gateway path с Bearer; legacy: presigned URL для скачивания.
   */
  string url = 10;

  /**
   * Пользователь, загрузивший файл.
   */
  optional ru.taska.common.v1.UserSummaryResponse uploaded_by_user = 11;
}

/**
 * Запрос на генерацию presigned URL для загрузки вложения.
 */
message CreateAttachmentUploadUrlRequest {
  // TAS-316: untrusted until verified by the message-bound mTLS/JWS interceptor.
  ru.taska.b2b.v1.RequestContext context = 100;

  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  CreateAttachmentUploadUrlRequestBody body = 2;
}

/**
 * Тело запроса на генерацию presigned URL для загрузки вложения.
 */
message CreateAttachmentUploadUrlRequestBody {
  /**
   * MIME-тип загружаемого файла.
   */
  string content_type = 1;

  /**
   * Размер файла в байтах.
   */
  int64 size_bytes = 2;

  /**
   * Идентификатор пользователя, выполняющего загрузку.
   */
  string actor_user_id = 3;

  /**
   * Идентификатор задачи, к которой прикрепляется вложение.
   */
  string issue_id = 4;
  string file_name = 5;
  string project_id = 6;
  string idempotency_key = 7;
}

/**
 * Запрос на подтверждение загрузки вложения.
 * После успешного вызова метаданные файла сохраняются в БД.
 */
message ConfirmAttachmentUploadRequest {
  // TAS-316: untrusted until verified by the message-bound mTLS/JWS interceptor.
  ru.taska.b2b.v1.RequestContext context = 100;

  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ConfirmAttachmentUploadRequestBody body = 2;
}

/**
 * Тело запроса на подтверждение загрузки вложения.
 */
message ConfirmAttachmentUploadRequestBody {
  /**
   * Ключ объекта в хранилище, полученный из CreateAttachmentUploadUrlResponse.
   */
  string object_key = 1;

  /**
   * Оригинальное имя файла.
   */
  string file_name = 2;

  /**
   * MIME-тип файла.
   */
  string content_type = 3;

  /**
   * Идентификатор пользователя, выполняющего загрузку.
   */
  string actor_user_id = 5;

  /**
   * Идентификатор задачи, к которой прикрепляется вложение.
   */
  string issue_id = 6;
  string project_id = 7;
}

/**
 * Запрос на получение списка вложений задачи.
 */
message ListAttachmentsRequest {
  // TAS-316: untrusted until verified by the message-bound mTLS/JWS interceptor.
  ru.taska.b2b.v1.RequestContext context = 100;

  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ListAttachmentsRequestBody body = 2;
}

/**
 * Тело запроса на получение списка вложений задачи.
 */
message ListAttachmentsRequestBody {
  /**
   * Идентификатор пользователя, запрашивающего список.
   */
  string actor_user_id = 1;

  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;
  string project_id = 3;
}

/**
 * Ответ со списком вложений задачи.
 */
message ListAttachmentsResponse {
  /**
   * Список вложений.
   */
  repeated AttachmentResponse attachments = 1;
}

/**
 * Запрос на получение native authenticated path либо legacy presigned URL.
 */
message GetAttachmentDownloadUrlRequest {
  // TAS-316: untrusted until verified by the message-bound mTLS/JWS interceptor.
  ru.taska.b2b.v1.RequestContext context = 100;

  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  GetAttachmentDownloadUrlRequestBody body = 2;
}

/**
 * Тело запроса на получение пути/ссылки для скачивания вложения.
 */
message GetAttachmentDownloadUrlRequestBody {
  /**
   * Идентификатор пользователя, запрашивающего скачивание.
   */
  string actor_user_id = 1;

  /**
   * Идентификатор вложения.
   */
  string attachment_id = 2;
  string project_id = 3;
  string issue_id = 4;
}

/**
 * Ответ с native authenticated path либо legacy presigned URL.
 */
message GetAttachmentDownloadUrlResponse {
  /**
   * Native: относительный gateway path с Bearer; legacy: presigned URL для скачивания.
   */
  string url = 1;

  /**
   * Контрольная сумма объекта.
   */
  string checksum = 2;
}

/**
 * Ответ с presigned URL для загрузки вложения.
 */
message CreateAttachmentUploadUrlResponse {
  /**
   * Presigned URL для загрузки файла напрямую в хранилище.
   */
  string upload_url = 1;

  /**
   * Ключ объекта в хранилище для последующего сохранения в БД.
   */
  string object_key = 2;

  /**
   * Время жизни presigned URL в секундах.
   */
  int64 expires_in = 3;
}

/**
 * Запрос на удаление вложения (мягкое удаление).
 */
message DeleteAttachmentRequest {
  // TAS-316: untrusted until verified by the message-bound mTLS/JWS interceptor.
  ru.taska.b2b.v1.RequestContext context = 100;

  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  DeleteAttachmentRequestBody body = 2;
}

/**
 * Тело запроса на удаление вложения.
 */
message DeleteAttachmentRequestBody {
  /**
   * Идентификатор пользователя, выполняющего удаление.
   */
  string actor_user_id = 1;

  /**
   * Идентификатор вложения.
   */
  string attachment_id = 2;
  string project_id = 3;
  string issue_id = 4;
}

// Приватная проверка исходных actor/credential и локального upload intent для quota owner.
// Scope по фазе: READ требует read; admission/finish/delete phases требуют write.
service AttachmentAdmissionService {
  rpc CheckAdmission(AttachmentAdmissionRequest) returns (AttachmentAdmissionGrant);
  rpc ReconcileUploads(ReconcileAttachmentUploadsRequest) returns (ReconcileAttachmentUploadsResponse);
  rpc ReconcileDeletions(ReconcileAttachmentDeletionsRequest) returns (ReconcileAttachmentDeletionsResponse);
}
message ReconcileAttachmentDeletionsRequest {
  ru.taska.b2b.v1.RequestContext context = 100;
  string after_id = 2;
  int32 limit = 3;
}
message ReconcileAttachmentDeletionsResponse {
  int32 processed = 1;
  int32 completed = 2;
  int32 failed = 3;
  int32 data_loss = 4;
  string next_cursor = 5;
}
message AttachmentAdmissionRequest {
  ru.taska.b2b.v1.RequestContext context = 100;
  string operation_id = 2;
  string resource_id = 3;
  string project_id = 4;
  string issue_id = 5;
  int64 bytes = 6;
  string expires_at = 7;
  string phase = 8;
}
message AttachmentAdmissionGrant {
  bool bypass_limit = 1;
  int64 maximum_attachment_bytes = 2;
  int64 policy_version = 3;
  int64 maximum_ttl_seconds = 4;
}

message ReconcileAttachmentUploadsRequest {
  ru.taska.b2b.v1.RequestContext context = 100;
  string after_id = 2;
  int32 limit = 3;
}
message ReconcileAttachmentUploadsResponse {
  int32 processed = 1;
  int32 failed = 2;
  string next_cursor = 3;
  // Нарушения целостности требуют расследования, а не только повторной попытки.
  int32 data_loss = 4;
}
