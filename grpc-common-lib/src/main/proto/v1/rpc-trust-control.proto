syntax = "proto3";
package ru.taska.b2b.v1;
import "v1/tenant-context.proto";
option java_multiple_files = true;
option java_package = "ru.taska.api.b2b.v1";
// Private control plane. Each call requires a currently allowlisted mTLS certificate.
// Deliberately separate from assertions, so online validation cannot recurse through itself.
message CheckRpcAuthorityRequest {
  RequestContext context = 1;
  string rpc = 2;
  bool tenant_required = 3;
  bool mutation = 4;
}
message RpcTrustDecision { bool allowed = 1; }
// Current primary authority for advisory capabilities. Never contains credentials or PII.
message RpcActorFacts {
  string actor_user_id = 1;
  string actor_generation = 2;
  string credential_id = 3;
  optional string session_id = 4;
  bool global_admin = 5;
  bool web_mfa = 6;
  repeated string scopes = 7;
  string expires_at = 8;
}
message ConsumeRpcAssertionRequest {
  string recipient = 1;
  string issuer = 2;
  string assertion_id = 3;
  string retain_until = 4;
}
message CheckRpcKeyRequest {
  string recipient = 1;
  string issuer = 2;
  string kid = 3;
  // Receiver obtains this from the actual TLS peer, never from protobuf/Header claims.
  string peer_certificate_sha256 = 4;
}
service RpcTrustControlService {
  rpc CheckRpcAuthority(CheckRpcAuthorityRequest) returns (RpcTrustDecision);
  rpc ConsumeRpcAssertion(ConsumeRpcAssertionRequest) returns (RpcTrustDecision);
  rpc CheckRpcKey(CheckRpcKeyRequest) returns (RpcTrustDecision);
  rpc GetRpcActorFacts(CheckRpcAuthorityRequest) returns (RpcActorFacts);
}
