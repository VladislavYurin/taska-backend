syntax = "proto3";

package ru.taska.auth.v1;

import "v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "ru.taska.api.auth.v1";
option java_outer_classname = "AuthApiProto";

service AuthService {
  rpc Signup(SignupRequest) returns (google.protobuf.Empty);
  rpc GetAuthMethods(google.protobuf.Empty) returns (AuthMethodsResponse);
  rpc PreviewInvitation(PreviewInvitationRequest) returns (PreviewInvitationResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Refresh (RefreshRequest) returns (RefreshResponse);
  rpc SetPasswordByToken(SetPasswordByTokenRequest) returns (google.protobuf.Empty);
  rpc ValidateAccessToken(ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
}

message LoginRequest {
  ru.taska.common.v1.Header header = 1;
  LoginRequestBody body = 2;
}

message LoginRequestBody {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3; // seconds
}

message RefreshRequest {
  ru.taska.common.v1.Header header = 1;
  RefreshRequestBody body = 2;
}

message RefreshRequestBody {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message SetPasswordByTokenRequest {
  ru.taska.common.v1.Header header = 1;
  SetPasswordByTokenRequestBody body = 2;
}

message SetPasswordByTokenRequestBody {
  string token = 1;
  string new_password = 2;
  optional string display_name = 3;
}

message ValidateAccessTokenRequest {
  ru.taska.common.v1.Header header = 1;
  ValidateAccessTokenRequestBody body = 2;
}

message ValidateAccessTokenRequestBody {
  string access_token = 1;
  // Opt-in only after the caller implements PAT scopes and restricted endpoint checks.
  bool allow_personal_token = 2;
  bool allow_oauth_token = 3;
  bool allow_delegated_token = 4;
}

message ValidateAccessTokenResponse {
  ru.taska.common.v1.UserContext user_context = 1;
}

message PreviewInvitationRequest {
  ru.taska.common.v1.Header header = 1;
  string token = 2;
}
message PreviewInvitationResponse {
  string email = 1;
  string display_name = 2;
  string kind = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message SignupRequest {
  ru.taska.common.v1.Header header = 1;
  string email = 2;
  string display_name = 3;
  string client_ip = 4;
}
message AuthMethodsResponse {
  bool signup_enabled = 1;
  repeated string providers = 2;
}
