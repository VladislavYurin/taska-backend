syntax = "proto3";
package ru.taska.auth.oauth.v1;
import "v1/common.proto";
import "v1/auth-service.proto";
import "google/protobuf/empty.proto";
option java_multiple_files = true;
option java_package = "ru.taska.api.auth.oauth.v1";

// Private service-to-service API, authenticated independently of the user's credential.
service OAuthIdentityService {
  rpc AuthenticateCredentials(ru.taska.auth.v1.LoginRequest) returns (ru.taska.auth.v1.ValidateAccessTokenResponse);
  rpc ClaimSignIn(ClaimOAuthSignInRequest) returns (ru.taska.auth.v1.ValidateAccessTokenResponse);
  rpc ListSignInProviders(google.protobuf.Empty) returns (ListOAuthSignInProvidersResponse);
  rpc ValidateSubject(ValidateOAuthSubjectRequest) returns (ru.taska.auth.v1.ValidateAccessTokenResponse);
  rpc ExchangeToken(ExchangeOAuthTokenRequest) returns (ExchangeOAuthTokenResponse);
  // TAS-498: tenant-bound grants approved by a verified tenant web session.
  rpc ClaimTenantOAuthGrant(ClaimTenantOAuthGrantRequest) returns (TenantOAuthGrantBinding);
  rpc ValidateTenantOAuthGrant(ValidateTenantOAuthGrantRequest) returns (TenantOAuthGrantBinding);
}
message ValidateOAuthSubjectRequest {
  ru.taska.common.v1.Header header = 1;
  string subject = 2;
}
message ExchangeOAuthTokenRequest {
  ru.taska.common.v1.Header header = 1;
  string access_token = 2;
  // No caller-supplied actor, audience or scopes: all authority derives from introspection.
}
message ExchangeOAuthTokenResponse {
  string delegation_token = 1;
  ru.taska.common.v1.UserContext user_context = 2;
}

message ClaimOAuthSignInRequest {
  ru.taska.common.v1.Header header = 1;
  string code = 2;
  // Private nonce from the originating authorization-server browser session.
  string nonce = 3;
}

message ListOAuthSignInProvidersResponse { repeated string providers = 1; }

// Bind an approved grant to the pending authorization it was approved for; succeeds once.
message ClaimTenantOAuthGrantRequest {
  ru.taska.common.v1.Header header = 1;
  string grant_id = 2;
  string user_id = 3;
  string client_id = 4;
  string authorization_request_id = 5;
}
// Code exchange and refresh: the claimed grant must still be live at the bound generation.
message ValidateTenantOAuthGrantRequest {
  ru.taska.common.v1.Header header = 1;
  string grant_id = 2;
  string user_id = 3;
  string client_id = 4;
  string grant_generation = 5;
}
message TenantOAuthGrantBinding {
  string grant_id = 1;
  string tenant_id = 2;
  repeated string scopes = 3;
  string grant_generation = 4;
}
