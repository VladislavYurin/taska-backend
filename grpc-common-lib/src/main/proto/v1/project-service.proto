syntax = "proto3";

option java_multiple_files = true;
option java_package = "ru.taska.api.project.v1";

import "google/protobuf/timestamp.proto";
import "v1/common.proto";

service ProjectService{
  rpc CreateProject (CreateProjectRequest) returns (ProjectResponse);
  rpc GetProject (GetProjectRequest) returns (ProjectResponse);
  rpc ListMyProjects (ListMyProjectsRequest) returns (stream ProjectResponse);
}

message CreateProjectRequest {
  ru.taska.common.v1.Header header = 1;
  string project_key = 2;
  string name = 3;
  string user_id = 4;
}

message GetProjectRequest {
  ru.taska.common.v1.Header header = 1;
  string projectId = 2;
}

message ProjectResponse {
  string id = 1;
  string project_key = 2;
  string name = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  optional google.protobuf.Timestamp archived_at = 7;
}

message ListMyProjectsRequest {
  ru.taska.common.v1.Header header = 1;
  string user_id = 2;
}