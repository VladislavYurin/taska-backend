syntax = "proto3";
package ru.taska.b2b.v1;
import "v1/tenant-context.proto";
import "v1/quota-admission.proto";
option java_multiple_files = true;
option java_package = "ru.taska.api.b2b.v1";
// TAS-310: implemented subset of docs/b2b/contracts/b2b.proto; wire numbers preserved.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AUTHENTICATION_REQUIRED = 1;
  ERROR_CODE_MFA_REQUIRED = 2;
  ERROR_CODE_TOKEN_REVOKED = 3;
  ERROR_CODE_TENANT_REQUIRED = 4;
  ERROR_CODE_TENANT_MISMATCH = 5;
  ERROR_CODE_TENANT_NOT_FOUND = 6;
  ERROR_CODE_MEMBERSHIP_INACTIVE = 7;
  ERROR_CODE_SCOPE_DENIED = 8;
  ERROR_CODE_SESSION_REQUIRED = 9;
  ERROR_CODE_ADMIN_GRANT_REQUIRED = 10;
  ERROR_CODE_ADMIN_SCOPE_DENIED = 11;
  ERROR_CODE_RESOURCE_NOT_FOUND = 12;
  ERROR_CODE_VERSION_CONFLICT = 13;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 14;
  ERROR_CODE_QUOTA_EXCEEDED = 15;
  ERROR_CODE_CAPABILITY_DISABLED = 16;
  ERROR_CODE_READ_ONLY = 17;
  ERROR_CODE_OWNER_REQUIRED = 18;
  ERROR_CODE_LAST_ADMIN = 19;
  ERROR_CODE_OWNER_MEMBERSHIP_PROTECTED = 20;
  ERROR_CODE_INVITATION_EXPIRED = 21;
  ERROR_CODE_INVITATION_EMAIL_MISMATCH = 22;
  ERROR_CODE_FREE_ELIGIBILITY_USED = 23;
  ERROR_CODE_PAYMENT_PENDING = 24;
  ERROR_CODE_INVALID_STATE = 25;
  ERROR_CODE_CONFIRMATION_REQUIRED = 26;
  ERROR_CODE_CONFIRMATION_EXPIRED = 27;
  ERROR_CODE_RATE_LIMITED = 28;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 29;
  ERROR_CODE_POLICY_NOT_CONFIGURED = 30;
  ERROR_CODE_VALIDATION_FAILED = 31;
}

enum RestrictionCode {
  RESTRICTION_CODE_UNSPECIFIED = 0;
  RESTRICTION_CODE_PAYMENT_EXPIRED = 1;
  RESTRICTION_CODE_OVER_QUOTA = 2;
  RESTRICTION_CODE_OWNER_PAUSE = 3;
  RESTRICTION_CODE_PLATFORM_BLOCK = 4;
  RESTRICTION_CODE_PAYMENT_DISPUTE = 5;
  RESTRICTION_CODE_PENDING_FIRST_PAYMENT = 6;
}

message Operation {
  enum StateValue { STATE_UNSPECIFIED = 0; STATE_PENDING = 1; STATE_RUNNING = 2; STATE_SUCCEEDED = 3; STATE_FAILED = 4; STATE_MANUAL_REVIEW = 5; }
  string id = 1;
  string type = 2;
  StateValue state = 3;
  string created_at = 4;
  string updated_at = 5;
  optional string tenant_id = 6;
  optional string resource_id = 7;
  optional ErrorCode failure_code = 8;
}

message Tenant {
  enum LifecycleValue { LIFECYCLE_UNSPECIFIED = 0; LIFECYCLE_PROVISIONING = 1; LIFECYCLE_AWAITING_PAYMENT = 2; LIFECYCLE_ACTIVE = 3; LIFECYCLE_AUTO_CLOSED = 4; LIFECYCLE_OWNER_CANCELLED = 5; LIFECYCLE_DELETING = 6; LIFECYCLE_DELETED = 7; }
  string id = 1;
  string name = 2;
  string owner_id = 3;
  LifecycleValue lifecycle = 4;
  repeated RestrictionCode restrictions = 5;
  string created_at = 6;
  optional string creation_deadline = 7;
  string version = 8;
  string owner_version = 9;
  optional string plan_version_id = 10;
  optional string creation_operation_id = 11;
  enum CreationKindValue { CREATION_KIND_UNSPECIFIED = 0; CREATION_KIND_FREE = 1; CREATION_KIND_PAID = 2; }
  optional CreationKindValue creation_kind = 12;
  enum CreationClosureReason { CREATION_CLOSURE_REASON_UNSPECIFIED = 0; CREATION_CLOSURE_REASON_AUTO_EXPIRED = 1; CREATION_CLOSURE_REASON_OWNER_CANCELLED = 2; }
  optional CreationClosureReason creation_closure_reason = 13;
  optional string creation_closed_at = 14;
}

message CreateTenantRequest {
  string name = 1;
  string plan_version_id = 2;
}

message CreateTenantResponse {
  Tenant tenant = 1;
  Operation operation = 2;
}

// idempotency_key MUST be a canonical UUID, matching B2B OpenAPI IdempotencyKey
// and docs/b2b/contracts/README.md section 7. Protobuf string does not relax that format.
message MutationOptions { string idempotency_key = 1; optional string expected_version = 2; }

message CreateTenantRpcRequest {
  RequestContext context = 1;
  CreateTenantRequest payload = 2;
  MutationOptions mutation = 3;
}

message GetTenantRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
}
message PageRequest { optional string cursor = 1; uint32 limit = 2; }

message Membership {
  enum RoleValue { ROLE_UNSPECIFIED = 0; ROLE_MEMBER = 1; ROLE_TENANT_ADMIN = 2; }
  enum StateValue { STATE_UNSPECIFIED = 0; STATE_ACTIVE = 1; STATE_SUSPENDED = 2; STATE_REMOVED = 3; }
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  RoleValue role = 4;
  StateValue state = 5;
  bool is_owner = 6;
  string display_name = 7;
  string email = 8;
  optional string avatar_path = 9;
  string version = 10;
}

message MembershipPage {
  repeated Membership items = 1;
  optional string next_cursor = 2;
}

message ListTenantMembersRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  PageRequest page = 3;
}

message ConfirmedAction { bool confirmed = 1; }
message CancelTenantCreationRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  ConfirmedAction payload = 3;
  MutationOptions mutation = 4;
}

message GetTenantOperationRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  string operation_id = 3;
}

message ChangeMemberRoleRequest {
  enum RoleValue { ROLE_UNSPECIFIED = 0; ROLE_MEMBER = 1; ROLE_TENANT_ADMIN = 2; }
  RoleValue role = 1;
}
message ChangeMemberStateRequest {
  enum StateValue { STATE_UNSPECIFIED = 0; STATE_ACTIVE = 1; STATE_SUSPENDED = 2; }
  StateValue state = 1;
}
message SetTenantMemberRoleRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  string user_id = 3;
  ChangeMemberRoleRequest payload = 4;
  MutationOptions mutation = 5;
}
message SetTenantMemberStateRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  string user_id = 3;
  ChangeMemberStateRequest payload = 4;
  MutationOptions mutation = 5;
}
message RemoveTenantMemberRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  string user_id = 3;
  MutationOptions mutation = 4;
}
message LeaveTenantRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  ConfirmedAction payload = 3;
  MutationOptions mutation = 4;
}

service TenantService {
  rpc SetTenantMemberRole(SetTenantMemberRoleRpcRequest) returns (Membership);
  rpc SetTenantMemberState(SetTenantMemberStateRpcRequest) returns (Membership);
  rpc RemoveTenantMember(RemoveTenantMemberRpcRequest) returns (Operation);
  rpc LeaveTenant(LeaveTenantRpcRequest) returns (Operation);
  rpc GetTenantQuotas(GetTenantQuotasRpcRequest) returns (QuotaSnapshot);
  rpc CancelTenantCreation(CancelTenantCreationRpcRequest) returns (Tenant);
  rpc GetTenantOperation(GetTenantOperationRpcRequest) returns (Operation);
  rpc CreateTenant(CreateTenantRpcRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRpcRequest) returns (Tenant);
  rpc ListTenantMembers(ListTenantMembersRpcRequest) returns (MembershipPage);
}

// TAS-311 internal authority: state only, no directory/credentials or mutation APIs.
message MembershipSnapshot {
  string tenant_id = 1;
  string user_id = 2;
  Membership.RoleValue role = 3;
  Membership.StateValue state = 4;
  string version = 5;
  string tenant_membership_version = 6;
  bool is_owner = 7;
  string joined_at = 8;
}
message GetMembershipRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  string user_id = 3;
}
message BatchValidateMembershipsRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  repeated string user_ids = 3; // 1..100 distinct canonical UUIDs, same tenant.
}
message MembershipValidation {
  string user_id = 1;
  bool found = 2;
  optional MembershipSnapshot membership = 3;
}
message MembershipValidationBatch {
  string tenant_id = 1;
  string tenant_membership_version = 2;
  repeated MembershipValidation items = 3; // Same order as requested user_ids.
  Tenant.LifecycleValue tenant_lifecycle = 4;
}
service TenantMembershipService {
  rpc GetMembership(GetMembershipRpcRequest) returns (MembershipSnapshot);
  rpc BatchValidateMemberships(BatchValidateMembershipsRpcRequest) returns (MembershipValidationBatch);
}
