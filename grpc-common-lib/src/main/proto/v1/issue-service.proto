syntax = "proto3";

package ru.taska.issue.v1;

import "v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.taska.api.issue.v1";
option java_outer_classname = "IssueApiProto";

enum IssueEventType {
  ISSUE_EVENT_TYPE_UNSPECIFIED = 0;
  ISSUE_EVENT_TYPE_CREATED = 1;
  ISSUE_EVENT_TYPE_UPDATED = 2;
  ISSUE_EVENT_TYPE_ASSIGNED = 3;
  ISSUE_EVENT_TYPE_TRANSITIONED = 4;
  ISSUE_EVENT_TYPE_DELETED = 5;
  ISSUE_LINK_EVENT_TYPE_CREATED = 6;
  ISSUE_LINK_EVENT_TYPE_DELETED = 7;
  ISSUE_EVENT_TYPE_ATTACHMENT_UPLOADED = 8;
  ISSUE_EVENT_TYPE_ATTACHMENT_DELETED = 9;
  ISSUE_EVENT_TYPE_COMMENT_CREATED = 10;
  ISSUE_EVENT_TYPE_COMMENT_UPDATED = 11;
  ISSUE_EVENT_TYPE_COMMENT_DELETED = 12;
  ISSUE_EVENT_TYPE_LABEL_ADDED = 13;
  ISSUE_EVENT_TYPE_LABEL_REMOVED = 14;
}

enum IssueType {
  ISSUE_TYPE_UNSPECIFIED = 0;
  ISSUE_TYPE_TASK = 1;
  ISSUE_TYPE_BUG = 2;
  ISSUE_TYPE_STORY = 3;
}

enum IssuePriority {
  ISSUE_PRIORITY_UNSPECIFIED = 0;
  ISSUE_PRIORITY_LOW = 1;
  ISSUE_PRIORITY_MEDIUM = 2;
  ISSUE_PRIORITY_HIGH = 3;
}

enum IssueLinkType {
  ISSUE_LINK_TYPE_UNSPECIFIED = 0;
  ISSUE_LINK_TYPE_BLOCKS = 1;
  ISSUE_LINK_TYPE_RELATES_TO = 2;
  ISSUE_LINK_TYPE_DUPLICATES = 3;
}

enum IssueLinkViewType {
  ISSUE_LINK_VIEW_TYPE_UNSPECIFIED = 0;
  ISSUE_LINK_VIEW_TYPE_RELATES_TO = 1;
  ISSUE_LINK_VIEW_TYPE_BLOCKS = 2;
  ISSUE_LINK_VIEW_TYPE_IS_BLOCKED_BY = 3;
  ISSUE_LINK_VIEW_TYPE_DUPLICATES = 4;
  ISSUE_LINK_VIEW_TYPE_IS_DUPLICATED_BY = 5;
}

service IssueService {
  /**
   * Создаёт новую задачу в проекте.
   */
  rpc CreateIssue(CreateIssueRequest)
      returns (IssueResponse);

  /**
   * Возвращает задачу по идентификатору.
   */
  rpc GetIssue(GetIssueRequest)
      returns (IssueWithHistoryResponse);

  /**
   * Мягкое удаление задачи.
   */
  rpc DeleteIssue(DeleteIssueRequest)
      returns (DeleteIssueResponse);

  /**
   * Обновление данных задачи.
   */
  rpc UpdateIssue(UpdateIssueRequest)
      returns (UpdateIssueResponse);

  /**
   * Возвращает список задач проекта с фильтрацией по статусу и исполнителю.
   */
  rpc ListIssues(ListIssuesRequest)
      returns (ListIssuesResponse);

  /**
   * Назначает исполнителя задачи.
   */
  rpc AssignIssue(AssignIssueRequest)
      returns (IssueResponse);

  /**
   * Делает переход задачи по workflow.
   */
  rpc TransitionIssue(TransitionIssueRequest)
      returns (IssueWithHistoryResponse);

  /**
   * Возвращает список связей для задачи.
   */
  rpc ListIssueLinks(ListIssueLinksRequest)
      returns (ListIssueLinksResponse);

  /**
   * Создаёт связь между задачами.
   */
  rpc CreateIssueLink(CreateIssueLinkRequest)
      returns (IssueLinkResponse);

  /**
   * Удаляет связь между задачами.
   */
  rpc DeleteIssueLink(DeleteIssueLinkRequest)
      returns (DeleteIssueLinkResponse);

  /**
  * Добавляет комментарий к задаче.
  */
  rpc AddIssueComment(AddIssueCommentRequest)
      returns (AddIssueCommentResponse);

  /**
   * Обновляет комментарий к задаче.
   */
  rpc UpdateIssueComment(UpdateIssueCommentRequest)
      returns (UpdateIssueCommentResponse);

  /**
   * Удаляет комментарий к задаче (мягкое удаление).
   */
  rpc DeleteIssueComment(DeleteIssueCommentRequest)
      returns (DeleteIssueCommentResponse);

  /**
   * Возвращает список комментариев к задаче.
   */
  rpc ListIssueComments(ListIssueCommentsRequest)
      returns (ListIssueCommentsResponse);

  // Управление метками проекта (только ADMIN)

  rpc CreateProjectLabel(CreateProjectLabelRequest) returns (ProjectLabelResponse);

  rpc UpdateProjectLabel(UpdateProjectLabelRequest) returns (ProjectLabelResponse);

  rpc DeleteProjectLabel(DeleteProjectLabelRequest) returns (DeleteProjectLabelResponse);

  rpc ListProjectLabels(ListProjectLabelsRequest) returns (ListProjectLabelsResponse);

  // Управление метками задачи (MEMBER/ADMIN)
  rpc AddIssueLabel(AddIssueLabelRequest) returns (AddIssueLabelResponse);

  rpc RemoveIssueLabel(RemoveIssueLabelRequest) returns (RemoveIssueLabelResponse);

  rpc ListIssueLabels(ListIssueLabelsRequest) returns (ListIssueLabelsResponse);
}

message AssignIssueRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  AssignIssueRequestBody body = 2;
}

message CreateIssueRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  CreateIssueRequestBody body = 2;
}

message AssignIssueRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор исполнителя.
   */
  string assignee_id = 3;

  /**
   * Идентификатор пользователя, кем заасайнена задача.
   */
  string actor_user_id = 4;
}

message CreateIssueRequestBody {
  /**
   * Ключ идемпотентности запроса.
   */
  string idempotency_key = 1;

  /**
   * Идентификатор проекта, в котором создаётся задача.
   */
  string project_id = 2;

  /**
   * Тип задачи.
   */
  IssueType issue_type = 3;

  /**
   * Краткое описание задачи.
   */
  string summary = 4;

  /**
   * Подробное описание задачи.
   */
  string description = 5;

  /**
   * Приоритет задачи.
   */
  IssuePriority priority = 6;

  /**
   * Идентификатор создателя задачи.
   */
  string reporter_id = 7;
}

message GetIssueRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  GetIssueRequestBody body = 2;
}

message GetIssueRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 3;
}

message DeleteIssueRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  DeleteIssueRequestBody body = 2;
}

message DeleteIssueRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор инициатора.
   */
  string actor_user_id = 3;
}

message UpdateIssueRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  UpdateIssueRequestBody body = 2;
}

message UpdateIssueRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор инициатора.
   */
  string actor_user_id = 3;

  /**
   * Краткое описание задачи.
   */
  string summary = 4;

  /**
   * Подробное описание задачи.
   */
  string description = 5;

  /**
   * Приоритет задачи.
   */
  IssuePriority priority = 6;
}

message ListIssuesRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ListIssuesRequestBody body = 2;
}

message ListIssuesRequestBody {
  /**
   * Идентификатор проекта.
   */
  string project_id = 1;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 2;

  /**
   * Фильтр по статусу задачи (опционально).
   */
  optional string status_key = 3;

  /**
   * Фильтр по идентификатору исполнителя (опционально).
   */
  optional string assignee_id = 4;

  /**
   * Размер страницы (если не указан, используется значение по умолчанию из конфига).
   */
  optional int32 page_size = 5;

  /**
   * Номер страницы, начиная с 0 (если не указан, используется 0 страница).
   */
  optional int32 page = 6;

  /**
   * Фильтр по идентификатору метки (опционально).
   */
  optional string label_id = 7;
}

message TransitionIssueRequest {

  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  TransitionIssueRequestBody body = 2;
}

message TransitionIssueRequestBody {

  /**
   * Идентификатор задачи.
   */
  string issue_id = 1;

  /**
   * Идентификатор перехода между двумя статусами в рамках workflow.
   */
  string transition_id = 2;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 3;

  /**
   * Дополнительные данные для перехода.
   */
  string payload = 4;
}

message ListIssueLinksRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  ListIssueLinksRequestBody body = 2;
}

message ListIssueLinksRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 1;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 2;
}

message CreateIssueLinkRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  CreateIssueLinkRequestBody body = 2;
}

message CreateIssueLinkRequestBody {
  /**
   * Идентификатор исходной задачи.
   */
  string source_issue_id = 1;

  /**
   * Идентификатор целевой задачи.
   */
  string target_issue_id = 2;

  /**
   * Тип связи между задачами.
   */
  IssueLinkType link_type = 3;

  /**
   * Идентификатор пользователя, создающего связь.
   */
  string actor_user_id = 4;
}

message DeleteIssueLinkRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  DeleteIssueLinkBody body = 2;
}

message DeleteIssueLinkBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 1;

  /**
   * Идентификатор удаляемой связи.
   */
  string link_id = 2;

  /**
   * Идентификатор пользователя, удаляющего связь.
   */
  string actor_user_id = 3;
}

message DeleteIssueResponse {
  /**
   * Идентификатор удалённой задачи.
   */
  string deleted_issue_id = 1;

  /**
   * Тип события по задаче.
   */
  IssueEventType issue_event_type = 2;
}

message UpdateIssueResponse {
  /**
   * Идентификатор обновлённой задачи.
   */
  string updated_issue_id = 1;

  /**
   * Краткое описание задачи.
   */
  string summary = 2;

  /**
   * Подробное описание задачи.
   */
  string description = 3;

  /**
   * Приоритет задачи.
   */
  IssuePriority priority = 4;
}

message ListIssuesResponse {
  /**
   * Список задач.
   */
  repeated IssueShortResponse issues = 1;

  /**
   * Общее количество задач, соответствующих фильтру.
   */
  int32 total_count = 2;
}

message IssueShortResponse {
  /**
   * Идентификатор задачи.
   */
  string id = 1;

  /**
   * Денормализованный ключ задачи (например, ABC-123).
   */
  string issue_key = 2;

  /**
   * Краткое описание задачи.
   */
  string summary = 3;

  /**
   * Тип задачи.
   */
  IssueType issue_type = 4;

  /**
   * Приоритет задачи.
   */
  IssuePriority priority = 5;

  /**
   * Идентификатор исполнителя задачи.
   */
  string assignee_id = 6;
}

message IssueResponse {
  /**
   * Идентификатор задачи.
   */
  string id = 1;

  /**
   * Идентификатор проекта.
   */
  string project_id = 2;

  /**
   * Порядковый номер задачи внутри проекта (например, 123 в ABC-123).
   */
  int32 issue_number = 3;

  /**
   * Денормализованный ключ задачи (например, ABC-123).
   */
  string issue_key = 4;

  /**
   * Тип задачи.
   */
  IssueType issue_type = 5;

  /**
   * Краткое описание задачи.
   */
  string summary = 6;

  /**
   * Подробное описание задачи.
   */
  string description = 7;

  /**
   * Текущий статус задачи.
   */
  string status_key = 8;

  /**
   * Приоритет задачи.
   */
  IssuePriority priority = 9;

  /**
   * Идентификатор исполнителя задачи.
   */
  string assignee_id = 10;

  /**
   * Идентификатор создателя задачи.
   */
  string reporter_id = 11;

  /**
   * Временная метка создания записи (аудит).
   */
  google.protobuf.Timestamp created_at = 12;

  /**
   * Временная метка последнего изменения записи (аудит).
   */
  google.protobuf.Timestamp updated_at = 13;

  /**
   * Версия задачи.
   */
  int32 version = 14;

  /**
   * Временная метка мягкого удаления (null — запись активна).
   */
  google.protobuf.Timestamp deleted_at = 15;

  /**
   * Идентификатор лейбла.
   */
  repeated ProjectLabelResponse labels = 16;
}

// Метка проекта
message ProjectLabelResponse {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp deleted_at = 7;
}

// Запрос на создание метки проекта
message CreateProjectLabelRequest {
  ru.taska.common.v1.Header header = 1;
  CreateProjectLabelRequestBody body = 2;
}

message CreateProjectLabelRequestBody {
  string project_id = 1;
  string name = 2;
  string color = 3;
  string created_by = 4;  // только ADMIN
}

// Запрос на обновление метки проекта
message UpdateProjectLabelRequest {
  ru.taska.common.v1.Header header = 1;
  UpdateProjectLabelRequestBody body = 2;
}

message UpdateProjectLabelRequestBody {
  string label_id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4;
  string actor_user_id = 5;  // ADMIN
}

// Запрос на удаление метки проекта
message DeleteProjectLabelRequest {
  ru.taska.common.v1.Header header = 1;
  DeleteProjectLabelRequestBody body = 2;
}

message DeleteProjectLabelRequestBody {
  string label_id = 1;
  string project_id = 2;
  string actor_user_id = 3;  // ADMIN
}

message DeleteProjectLabelResponse {
  string label_id = 1;
  string project_id = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

// Запрос на получение списка меток проекта
message ListProjectLabelsRequest {
  ru.taska.common.v1.Header header = 1;
  ListProjectLabelsRequestBody body = 2;
}

message ListProjectLabelsRequestBody {
  string project_id = 1;
  string actor_user_id = 2;  // VIEWER+
}

message ListProjectLabelsResponse {
  repeated ProjectLabelResponse labels = 1;
  int32 total_count = 2;
}

// Запрос на добавление метки к задаче
message AddIssueLabelRequest {
  ru.taska.common.v1.Header header = 1;
  AddIssueLabelRequestBody body = 2;
}

message AddIssueLabelRequestBody {
  string issue_id = 1;
  string label_id = 2;
  string actor_user_id = 3;  //(он же created_by) MEMBER+
}

message AddIssueLabelResponse {
  string issue_id = 1;
  string label_id = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Запрос на удаление метки с задачи
message RemoveIssueLabelRequest {
  ru.taska.common.v1.Header header = 1;
  RemoveIssueLabelRequestBody body = 2;
}

message RemoveIssueLabelRequestBody {
  string issue_id = 1;
  string label_id = 2;
  string actor_user_id = 3;  // MEMBER+
}

message RemoveIssueLabelResponse {
  string issue_id = 1;
  string label_id = 2;
}

// Запрос на получение меток задачи
message ListIssueLabelsRequest {
  ru.taska.common.v1.Header header = 1;
  ListIssueLabelsRequestBody body = 2;
}

message ListIssueLabelsRequestBody {
  string issue_id = 1;
  string actor_user_id = 2; // VIEWER+
}

message ListIssueLabelsResponse {
  repeated ProjectLabelResponse labels = 1;
}

message IssueHistoryResponse {
  /**
   * Идентификатор записи истории.
   */
  string id = 1;

  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Тип события.
   */
  IssueEventType event_type = 3;

  /**
   * Идентификатор пользователя, инициировавшего событие.
   */
  string actor_user_id = 4;

  /**
   * Временная метка наступления события.
   */
  google.protobuf.Timestamp occurred_at = 5;

  /**
   * Полезная нагрузка события в формате JSON.
   */
  string payload = 6;
}

/**
 * Ответ на получение задачи с историей.
 */
message IssueWithHistoryResponse {
  /**
   * Данные задачи.
   */
  IssueResponse issue = 1;

  /**
   * История изменений задачи.
   */
  repeated IssueHistoryResponse history = 2;
}

message ListIssueLinksResponse {
  /**
   * Список связей задачи.
   */
  repeated IssueLinkResponse issue_links = 1;
}

message IssueLinkResponse {
  /**
   * Идентификатор связи.
   */
  string id = 1;

  /**
   * Идентификатор проекта.
   */
  string project_id = 2;

  /**
   * Идентификатор исходной задачи.
   */
  string source_issue_id = 3;

  /**
   * Идентификатор целевой задачи.
   */
  string target_issue_id = 4;

  /**
   * Тип связи между задачами.
   */
  IssueLinkViewType view_link_type = 5;

  /**
   * Идентификатор пользователя, создавшего связь.
   */
  string created_by = 6;

  /**
   * Временная метка создания записи (аудит).
   */
  google.protobuf.Timestamp created_at = 7;

  /**
   * Временная метка мягкого удаления (null — запись активна).
   */
  google.protobuf.Timestamp deleted_at = 8;
}

message DeleteIssueLinkResponse {
  /**
   * Идентификатор удаленной связи.
   */
  string link_id = 1;

  /**
   * Тип события.
   */
  IssueEventType event_type = 2;
}
// ===== Comment messages =====
/**
 * Комментарий к задаче.
 */
message IssueCommentResponse {
  /**
   * Идентификатор комментария.
   */
  string id = 1;

  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор проекта.
   */
  string project_id = 3;

  /**
   * Идентификатор автора комментария.
   */
  string author_user_id = 4;

  /**
   * Текст комментария.
   */
  string body = 5;

  /**
   * Временная метка создания.
   */
  google.protobuf.Timestamp created_at = 6;

  /**
   * Временная метка последнего изменения.
   */
  google.protobuf.Timestamp updated_at = 7;

  /**
   * Версия комментария.
   */
  int32 version = 8;
}

/**
 * Запрос на добавление комментария.
 */
message AddIssueCommentRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  AddIssueCommentRequestBody body = 2;
}

/**
 * Тело запроса на добавление комментария.
 */
message AddIssueCommentRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор автора комментария.
   */
  string author_user_id = 3;

  /**
   * Текст комментария.
   */
  string body = 4;
}

/**
 * Ответ на добавление комментария.
 */
message AddIssueCommentResponse {
  /**
   * Созданный комментарий.
   */
  IssueCommentResponse comment = 1;
}

/**
 * Запрос на обновление комментария.
 */
message UpdateIssueCommentRequest {
  /**
   * Заголовок запроса.
   */
  ru.taska.common.v1.Header header = 1;

  /**
   * Тело запроса.
   */
  UpdateIssueCommentRequestBody body = 2;
}

/**
 * Тело запроса на обновление комментария.
 */
message UpdateIssueCommentRequestBody {
  /**
   * Идентификатор задачи.
   */
  string issue_id = 2;

  /**
   * Идентификатор комментария.
   */
  string comment_id = 3;

  /**
   * Идентификатор пользователя, инициировавшего запрос.
   */
  string actor_user_id = 4;

  /**
   * Новый текст комментария.
   */
  string body = 5;
