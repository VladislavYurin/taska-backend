# Standalone opt-in stack. It never starts or reconfigures the shared Taska deployment.
services:
  billing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_operator
      POSTGRES_PASSWORD: ${BILLING_OPERATOR_PASSWORD:?Set BILLING_OPERATOR_PASSWORD}
      BILLING_APP_PASSWORD: ${BILLING_APP_PASSWORD:?Set BILLING_APP_PASSWORD}
      BILLING_DEPLOY_PASSWORD: ${BILLING_DEPLOY_PASSWORD:?Set BILLING_DEPLOY_PASSWORD}
    volumes:
      - ../../common-lib/src/main/resources/db/billing:/opt/taska/templates:ro
      - ./init.sql:/docker-entrypoint-initdb.d/10-billing.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U billing_operator -d billing_db']
      interval: 2s
      retries: 30
  billing-service:
    build:
      context: ../..
      dockerfile: billing-service/Dockerfile
    environment:
      BILLING_CATALOG_CURSOR_KEY: ${BILLING_CATALOG_CURSOR_KEY:?Set BILLING_CATALOG_CURSOR_KEY}
      BILLING_SERVER_PORT: 8080
      BILLING_GRPC_SERVER_PORT: 9090
      BILLING_SPRING_R2DBC_URL: r2dbc:postgresql://billing-db:5432/billing_db
      BILLING_SPRING_R2DBC_USERNAME: taska_billing_app
      BILLING_SPRING_R2DBC_PASSWORD: ${BILLING_APP_PASSWORD:?Set BILLING_APP_PASSWORD}
      BILLING_SPRING_LIQUIBASE_URL: jdbc:postgresql://billing-db:5432/billing_db
      BILLING_SPRING_LIQUIBASE_USERNAME: taska_billing_deployer
      BILLING_SPRING_LIQUIBASE_PASSWORD: ${BILLING_DEPLOY_PASSWORD:?Set BILLING_DEPLOY_PASSWORD}
    depends_on:
      billing-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8090:8080'
      - '127.0.0.1:9100:9090'
