version: "3.9"

name: taska

networks:
  taska-net:

volumes:
  pg_auth_data:
  pg_project_data:
  pg_workflow_data:
  pg_issue_data:
  pg_notification_data:
  pg_admin_data:
  kafka_data:
  grafana_data:

services:
  # --------------------
  # Kafka (KRaft mode)
  # --------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: taska-kafka
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "9092:9092"   # external access from host

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --------------------
  # KafkaUI
  # --------------------
  kafbat-ui:
    container_name: taska-kafka-ui
    image: ghcr.io/kafbat/kafka-ui
    networks: [ taska-net ]
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: taska-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # --------------------
  # Loki
  # --------------------
  loki:
    image: grafana/loki:3.7.3
    container_name: taska-loki
    networks: [ taska-net ]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # --------------------
  # Promtail
  # --------------------
  promtail:
    image: grafana/promtail:3.6.11
    container_name: taska-promtail
    networks: [ taska-net ]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # --------------------
  # Grafana
  # --------------------
  grafana:
    image: grafana/grafana:11.6.16
    container_name: taska-grafana
    networks: [ taska-net ]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - .env.docker
    depends_on:
      - loki

  # --------------------
  # Postgres
  # --------------------
  auth-db:
    image: postgres:16
    container_name: taska-auth-db
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=taska
      - POSTGRES_PASSWORD=taska
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  project-db:
    image: postgres:16
    container_name: taska-project-db
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=project_db
      - POSTGRES_USER=taska
      - POSTGRES_PASSWORD=taska
    volumes:
      - pg_project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska -d project_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  workflow-db:
    image: postgres:16
    container_name: taska-workflow-db
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=workflow_db
      - POSTGRES_USER=taska
      - POSTGRES_PASSWORD=taska
    volumes:
      - pg_workflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska -d workflow_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  issue-db:
    image: postgres:16
    container_name: taska-issue-db
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_DB=issue_db
      - POSTGRES_USER=taska
      - POSTGRES_PASSWORD=taska
    volumes:
      - pg_issue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska -d issue_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-db:
    image: postgres:16
    container_name: taska-notification-db
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_DB=notification_db
      - POSTGRES_USER=taska
      - POSTGRES_PASSWORD=taska
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin-db:
    image: postgres:16
    container_name: taska-admin-db
    networks: [taska-net]
    env_file:
      - .env.docker
    ports:
      - "5438:5432"
    environment:
      - POSTGRES_DB=taska_admin_db
      - POSTGRES_USER=taska
      - POSTGRES_PASSWORD=taska
    volumes:
      - pg_admin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska -d taska_admin_db"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --------------------
  # Microservices
  # --------------------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: taska-auth-service
    networks: [taska-net]
    depends_on:
      kafka:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8081:8080"
      - "9091:9090"

  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    container_name: taska-project-service
    networks: [taska-net]
    depends_on:
      kafka:
        condition: service_healthy
      project-db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8082:8080"
      - "9096:9090"

  workflow-service:
    build:
      context: .
      dockerfile: workflow-service/Dockerfile
    container_name: taska-workflow-service
    networks: [taska-net]
    depends_on:
      workflow-db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8083:8080"
      - "9093:9090"

  issue-service:
    build:
      context: .
      dockerfile: issue-service/Dockerfile
    container_name: taska-issue-service
    networks: [taska-net]
    depends_on:
      kafka:
        condition: service_healthy
      issue-db:
        condition: service_healthy
      project-service:
        condition: service_started
      workflow-service:
        condition: service_started
    env_file:
      - .env.docker
    ports:
      - "8084:8080"
      - "9094:9090"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: taska-notification-service
    networks: [taska-net]
    depends_on:
      kafka:
        condition: service_healthy
      notification-db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8085:8080"
      - "9095:9090"

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: taska-admin-service
    networks: [taska-net]
    depends_on:
      admin-db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8086:8080"
      - "9097:9090"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: taska-api-gateway
    networks: [taska-net]
    depends_on:
      auth-service:
        condition: service_started
      project-service:
        condition: service_started
      issue-service:
        condition: service_started
      workflow-service:
        condition: service_started
      notification-service:
        condition: service_started
    env_file:
      - .env.docker
    ports:
      - "8080:8080"