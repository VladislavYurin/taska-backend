name: taska

networks:
  taskanetwork:
    name: taskanetwork
    driver: bridge
  public:
    name: public
    driver: bridge

volumes:
  pg_auth_data:
  pg_project_data:
  pg_workflow_data:
  pg_issue_data:
  pg_notification_data:
  pg_admin_data:
  pgadmin_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  minio_data:

  # --------------------
  # Базовые настройки для сервисов
  # --------------------
x-app-defaults: &app-defaults
  restart: unless-stopped
  env_file:
    - .env
  healthcheck:
    test: "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"
    interval: 10s
    timeout: 5s
    retries: 12

  # --------------------
  # Базовые настройки для БД
  # --------------------
x-postgres-defaults: &postgres-defaults
  image: postgres:16
  networks:
    - taskanetwork
  restart: unless-stopped
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
    interval: 10s
    timeout: 5s
    retries: 12
  env_file:
    - .env

services:
  # --------------------
  # Kafka (KRaft mode)
  # --------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: taska-kafka
    networks:
     - taskanetwork
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12

  # --------------------
  # KafkaUI
  # --------------------
  kafbat-ui:
    container_name: taska-kafka-ui
    image: ghcr.io/kafbat/kafka-ui:260f9e8
    networks:
      - taskanetwork
      - public
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: ${DYNAMIC_CONFIG_ENABLED}
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTERS_0_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}


  # --------------------
  # Loki
  # --------------------
  loki:
    image: grafana/loki:3.7.3
    container_name: taska-loki
    networks:
      - taskanetwork
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml

  # --------------------
  # Promtail
  # --------------------
  promtail:
    image: grafana/promtail:3.6.11
    container_name: taska-promtail
    networks:
      - taskanetwork
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started

  # --------------------
  # Grafana
  # --------------------
  grafana:
    image: grafana/grafana:11.6.16
    container_name: taska-grafana
    networks:
      - taskanetwork
      - public
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro # Монтируем папку provisioning (в ней лежат папки dashboard и datasource). Без этого созданные вручную настройки пропадут при перезапуске контейнера
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro # Монтируем папку с вашими JSON-дашбордами автоматической загрузки готовых дашбордов (файлы JSON) при старте
    env_file:
      - .env
    depends_on:
      prometheus:
        condition: service_started
      loki:
          condition: service_started
  # --------------------
  # Prometheus
  # --------------------
  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: taska-prometheus
    networks:
      - taskanetwork
      - public
    env_file:
      - .env
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro # Монтируем файл конфигурации. (:ro) Режим read-only. Prometheus не сможет случайно испортить ваш файл конфигурации.
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml' # Указываем Prometheus, где именно внутри контейнера искать файл настроек
      - '--storage.tsdb.path=/prometheus'  # Указываем путь к папке, куда сохранять базу данных метрик
      - '--web.enable-lifecycle' #  ВАЖНО: Активирует API управления. Позволяет обновить настройки на лету БЕЗ перезапуска контейнера. После изменения файла prometheus.yml достаточно выполнить команду: curl -X POST http://localhost:9090/-/reload
    restart: unless-stopped # Автоматический перезапуск контейнера при ошибках
  # --------------------
  # MinIO
  # --------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: taska-minio
    networks:
      - taskanetwork
      - public
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: taska-minio-init
    networks:
      - taskanetwork
    restart: on-failure
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$MINIO_BUCKET_AVATARS &&
        mc mb --ignore-existing local/$$MINIO_BUCKET_ATTACHMENTS &&
        echo 'Buckets initialized'
      "

  # --------------------
  # Postgres
  # --------------------
  pgadmin:
    image: dpage/pgadmin4:9.3
    container_name: taska-pgadmin
    networks:
      - taskanetwork
      - public
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      auth-db:
        condition: service_healthy
      project-db:
        condition: service_healthy
      issue-db:
        condition: service_healthy
      workflow-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy

  auth-db:
    <<: *postgres-defaults
    container_name: taska-auth-db
    environment:
      - POSTGRES_DB=${AUTH_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_auth_data:/var/lib/postgresql/data

  project-db:
    <<: *postgres-defaults
    container_name: taska-project-db
    environment:
      - POSTGRES_DB=${PROJECT_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_project_data:/var/lib/postgresql/data

  workflow-db:
    <<: *postgres-defaults
    container_name: taska-workflow-db
    environment:
      - POSTGRES_DB=${WORKFLOW_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_workflow_data:/var/lib/postgresql/data

  issue-db:
    <<: *postgres-defaults
    container_name: taska-issue-db
    environment:
      - POSTGRES_DB=${ISSUE_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_issue_data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres-defaults
    container_name: taska-notification-db
    environment:
      - POSTGRES_DB=${NOTIFICATION_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_notification_data:/var/lib/postgresql/data

  admin-db:
    <<: *postgres-defaults
    container_name: taska-admin-db
    environment:
      - POSTGRES_DB=${ADMIN_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_admin_data:/var/lib/postgresql/data

  # --------------------
  # Microservices
  # --------------------
  auth-service:
    <<: *app-defaults
    networks:
      - taskanetwork
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: taska-auth-service
    depends_on:
      kafka:
        condition: service_healthy
      auth-db:
        condition: service_healthy

  project-service:
    <<: *app-defaults
    networks:
      - taskanetwork
    build:
      context: .
      dockerfile: project-service/Dockerfile
    container_name: taska-project-service
    depends_on:
      kafka:
        condition: service_healthy
      project-db:
        condition: service_healthy

  workflow-service:
    <<: *app-defaults
    networks:
      - taskanetwork
    build:
      context: .
      dockerfile: workflow-service/Dockerfile
    container_name: taska-workflow-service
    depends_on:
      workflow-db:
        condition: service_healthy

  issue-service:
    <<: *app-defaults
    networks:
      - taskanetwork
    build:
      context: .
      dockerfile: issue-service/Dockerfile
    container_name: taska-issue-service
    depends_on:
      kafka:
        condition: service_healthy
      issue-db:
        condition: service_healthy
      project-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy

  notification-service:
    <<: *app-defaults
    networks:
      - taskanetwork
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: taska-notification-service
    depends_on:
      kafka:
        condition: service_healthy
      notification-db:
        condition: service_healthy

  admin-service:
    <<: *app-defaults
    networks:
      - taskanetwork
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: taska-admin-service
    depends_on:
      admin-db:
        condition: service_healthy

  api-gateway:
    <<: *app-defaults
    networks:
      - taskanetwork
      - public
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: taska-api-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      issue-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy