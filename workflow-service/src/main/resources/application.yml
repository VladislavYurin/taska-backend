server:
  port: ${WORKFLOW_SERVER_PORT:8083}

spring:
  application:
    name: workflow-service
  grpc:
    server:
      port: ${WORKFLOW_GRPC_SERVER_PORT:9093}
  r2dbc:
    url: ${WORKFLOW_SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5435/workflow_db}
    username: ${WORKFLOW_SPRING_R2DBC_USERNAME:taska}
    password: ${WORKFLOW_SPRING_R2DBC_PASSWORD:taska}
  liquibase:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-master.yaml
      url: ${WORKFLOW_SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5435/workflow_db}
      user: ${WORKFLOW_SPRING_LIQUIBASE_USERNAME:taska}
      password: ${WORKFLOW_SPRING_LIQUIBASE_PASSWORD:taska}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      # Разрешает сбор метрик Prometheus
      enabled: true
    metrics:
      tags:
        #Prometheus сразу поймет, от какого сервиса пришли метрики
        application: ${spring.application.name}

grpc:
  client:
    project-service:
      host: ${PROJECT_GRPC_HOST:localhost}
      port: ${PROJECT_GRPC_PORT:9096}

logging:
  level:
    ru.taska: ${WORKFLOW_LOG_LEVEL_ROOT:INFO}
    liquibase: ${WORKFLOW_LOG_LEVEL_LIQUIBASE:INFO}

workflow:
  default-project-id: 00000000-0000-0000-0000-000000000000
  allowed-roles:
    create-workflow-roles:
      - ADMIN
  validation:
    name-max-length: 100
    status-key-pattern: "^[A-Z][A-Z0-9_]{1,63}$"