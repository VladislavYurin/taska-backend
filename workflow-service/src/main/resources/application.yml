server:
  port: ${SERVER_PORT:8083}

spring:
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9093}
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5435/workflow_db}
    username: ${SPRING_R2DBC_USERNAME:taska}
    password: ${SPRING_R2DBC_PASSWORD:taska}
  liquibase:
      enabled: true
      change-log: classpath:/db/changelog/db.changelog-master.yaml
      url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5435/workflow_db}
      user: ${SPRING_LIQUIBASE_USERNAME:taska}
      password: ${SPRING_LIQUIBASE_PASSWORD:taska}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    ru.taska: ${LOG_LEVEL_ROOT:INFO}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}