openapi: 3.0.3
info:
  title: Taska API Gateway Contract
  version: 1.0.0

servers:
  - url: /
    description: Current host

paths:
  /api/v1/auth/login:
    post:
      summary: Аутентификация пользователя
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Успешный вход
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Обновление токенов (access/refresh)
      operationId: refresh
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestDto'
      responses:
        '200':
          description: Токены успешно обновлены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/invitations/accept:
    post:
      summary: Принятие инвайта и установка пароля
      operationId: setPasswordByToken
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordByTokenRequestDto'
      responses:
        '204':
          description: Пароль успешно изменен (No Content)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/me:
    get:
      summary: Получение данных текущего пользователя
      operationId: getMyInfo
      tags:
        - auth
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Данные успешно получены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateAccessTokenResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/notifications:
    get:
      summary: Получение inbox уведомлений текущего пользователя
      operationId: listNotifications
      tags:
        - notifications
      security:
        - bearerAuth: [ ]
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        '200':
          description: Уведомления успешно получены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/notifications/{notificationId}/read:
    patch:
      summary: Отметка уведомления текущего пользователя как прочитанного
      operationId: markNotificationAsRead
      tags:
        - notifications
      security:
        - bearerAuth: [ ]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Уведомление успешно отмечено как прочитанное
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects:
    post:
      summary: Создание проекта
      operationId: createProject
      tags:
        - project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequestDto'
      responses:
        '201':
          description: Проект успешно создан
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    get:
      summary: Возвращает проекты текущего пользователя
      operationId: listMyProjects
      tags:
        - project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список проектов успешно получен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMyProjectResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}:
    get:
      summary: Возвращает проект по идентификатору
      operationId: getProject
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Проект успешно найден
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/members:
    post:
      summary: Добавляет участника в проект
      operationId: addProjectMember
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequestDto'
      responses:
        '201':
          description: Участник успешно добавлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/members/{userId}:
    patch:
      summary: Меняет роль участника
      operationId: changeProjectMemberRole
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProjectMemberRoleRequestDto'
      responses:
        '200':
          description: Роль участника успешно изменена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      summary: Удаляет участника из проекта
      operationId: removeProjectMember
      tags:
        - project
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Участник успешно удален
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/issues:
    post:
      summary: Создание задачи
      operationId: createIssue
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string

        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequestDto'

      responses:
        '201':
          description: Создана новая задача
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    get:
      summary: Возвращает задачи проекта с фильтрами и пагинацией
      operationId: listIssues
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string

        - name: status
          in: query
          required: false
          schema:
            type: string

        - name: assigneeId
          in: query
          required: false
          schema:
            type: string

        - name: page
          in: query
          required: false
          schema:
            type: integer

        - name: pageSize
          in: query
          required: false
          schema:
            type: integer

        - name: labelId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по идентификатору метки (возвращает задачи, имеющие эту метку)

      responses:
        '200':
          description: Список задач успешно найден
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIssuesResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/issues/{issueId}/links:
    get:
      summary: Возвращает список связей для задачи
      operationId: listIssueLinks
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Список связей задачи успешно найден
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIssueLinksResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      summary: Устанавливает новую связь для задачи
      operationId: createIssueLink
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueLinkRequestDto'

      responses:
        '201':
          description: Связь между задачами успешно создана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueLinkResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/issues/{issueId}/links/{linkId}:
    delete:
      summary: Выполняет мягкое удаление связи между задачами
      operationId: deleteIssueLink
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

        - name: linkId
          in: path
          required: true
          schema:
            type: string

      responses:
        '204':
          description: Связь между задачами успешно удалена (No Content)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/issues/{issueId}:
    get:
      summary: Возвращает задачу с историей
      operationId: getIssue
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Задача с историей успешно найдена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueWithHistoryResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    put:
      summary: Обновляет основные поля задачи
      operationId: updateIssue
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequestDto'

      responses:
        '200':
          description: Данные задачи успешно обновлены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIssueResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      summary: Выполняет мягкое удаление задачи
      operationId: deleteIssue
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      responses:
        '204':
          description: Задача успешно удалена (No Content)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/issues/{issueId}/assignee:
    put:
      summary: Назначает исполнителя задачи
      operationId: assignIssue
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIssueRequestDto'

      responses:
        '200':
          description: Исполнитель задачи успешно назначен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/issues/{issueId}/transition/{transitionId}:
    put:
      summary: Выполняет переход задачи по workflow (меняет статус задачи)
      operationId: transitionIssue
      tags:
        - issue
      security:
        - bearerAuth: [ ]

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

        - name: transitionId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionIssueRequestDto'

      responses:
        '200':
          description: Статус задачи успешно изменен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueWithHistoryResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  ########################## API для issue комментариев ##################
  /api/v1/projects/{projectId}/issues/{issueId}/comments:
    get:
      summary: Получение списка комментариев к задаче
      operationId: listComments
      tags:
        - comments
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Список комментариев успешно получен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsListResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      summary: Добавление комментария к задаче
      operationId: addComment
      tags:
        - comments
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequestDto'
      responses:
        '200':
          description: Комментарий успешно добавлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
    ########################## Окончание API для issue комментариев ##################

  /api/v1/projects/{projectId}/issues/{issueId}/comments/{commentId}:
    put:
      summary: Обновление комментария
      operationId: updateComment
      tags:
        - comments
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequestDto'
      responses:
        '200':
          description: Комментарий успешно обновлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      summary: Удаление комментария
      operationId: deleteComment
      tags:
        - comments
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Комментарий успешно удален
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/workflow:
    get:
      summary: Получение workflow проекта и типа задачи
      operationId: getWorkflowForProject
      tags:
        - workflow
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          description: Уникальный идентификатор проекта (UUID)
          schema:
            type: string
            format: uuid
        - name: issueType
          in: query
          required: true
          description: Тип задачи, для которой запрашивается workflow
          schema:
            $ref: '#/components/schemas/IssueTypeDto'
      responses:
        '200':
          description: Workflow успешно получен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  ########################## API для project/issue меток ##################

  /api/v1/projects/{projectId}/labels:
    get:
      summary: Получение списка меток проекта
      operationId: listProjectLabels
      tags:
        - labels
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список меток успешно получен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectLabelsResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      summary: Добавление метки к проекту
      operationId: createProjectLabel
      tags:
        - labels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectLabelRequestDto'
      responses:
        '201':
          description: Метка успешно создана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLabelResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/labels/{labelId}:
    patch:
      summary: Обновление метки проекта
