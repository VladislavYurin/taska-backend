    # ==================== Окончание КОММЕНТАРИИ к issue ====================

    WorkflowResponseDto:
      type: object
      required: [ id, name, version, createdAt, updatedAt, statuses, transitions ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
