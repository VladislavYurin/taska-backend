  /api/v1/readonly/{service}/{table}:
    get:
      summary: Получение строк таблицы из сервисной БД (только для GLOBAL_ADMIN)
      operationId: listTableRows
      tags:
        - admin
      security:
        - bearerAuth: [ ]
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
          description: Имя сервиса (auth, project, issue, workflow, notification, admin). Актуальный список возвращается через GET /api/v1/readonly/catalog.
        - name: table
          in: path
          required: true
          schema:
            type: string
          description: Имя таблицы. Актуальный список таблиц возвращается через GET /api/v1/readonly/catalog.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Колонка для сортировки
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [ asc, desc ]
            default: asc
        - name: filter
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
          description: |
            Фильтры по колонкам таблицы. Формат ключа: column.operator.

            Параметры page, pageSize, sort, order — не фильтры (пагинация/сортировка).

            Поддерживаемые операторы:
            - .equals — точное совпадение (column = value)
            - .contains — поиск по подстроке (column LIKE '%value%')
            - .from — нижняя граница для timestamp (column >= value)
            - .to — верхняя граница для timestamp (column <= value)

            Примеры:
            - ?status.equals=active → status = 'active'
            - ?email.contains=@gmail.com → email LIKE '%@gmail.com%'
            - ?created_at.from=2026-01-01T00:00:00Z → created_at >= '2026-01-01'
            - ?status.equals=active&email.contains=@test.com → комбинация фильтров

            Каждый ключ фильтра может быть указан только один раз.
            При дублировании (?status.equals=active&status.equals=blocked) будет использовано только одно значение.
      responses:
        '200':
          description: Данные успешно получены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadOnlyTableRowsResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/readonly/{service}/{table}/{id}:
    get:
      summary: Получение одной строки таблицы по ID (только для GLOBAL_ADMIN)
      operationId: getTableRowById
      tags:
        - admin
      security:
        - bearerAuth: [ ]
      parameters:
        - name: service
          in: path
