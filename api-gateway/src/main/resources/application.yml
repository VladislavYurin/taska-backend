server:
  port: ${GATEWAY_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-and-validation-must-be-long-enough}

# spring cloud gateway settings
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Незащищённый эндпоинт
            - id: auth_login
              uri: ${GATEWAY_AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**

            # Защищенный эндпоинт (пример)
            - id: test-service-protected-example
              uri: https://wikipedia.com
              predicates:
                - Path=/test-service/**
              filters:
                - JwtValidating

logging:
  level:
    ru.taska: ${GATEWAY_LOG_LEVEL_ROOT:INFO}