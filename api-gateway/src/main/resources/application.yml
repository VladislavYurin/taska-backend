server:
  port: ${GATEWAY_SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

grpc:
  client:
    auth-service:
      host: ${AUTH_GRPC_HOST:localhost}
      port: ${AUTH_GRPC_PORT:9091}
      deadlineDuration: ${AUTH_GRPC_DEADLINE:3000}

logging:
  level:
    ru.taska: ${GATEWAY_LOG_LEVEL_ROOT:INFO}

app:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:https://taska.ozero.dev}
    allow-credentials: ${GATEWAY_CORS_ALLOW_CREDENTIALS:true}
    allowed-methods: ${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
    allowed-headers: ${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Request-Id,Idempotency-Key}
    exposed-headers: ${GATEWAY_CORS_EXPOSED_HEADERS:X-Request-Id}