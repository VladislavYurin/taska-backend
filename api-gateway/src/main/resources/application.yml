server:
  port: ${GATEWAY_SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

springdoc:
  swagger-ui:
    url: /openapi.yml
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    # Разрешает сбор метрик Prometheus
  metrics:
    tags:
      #Prometheus сразу поймет, от какого сервиса пришли метрики
      application: ${spring.application.name}

grpc:
  client:
    auth-service:
      host: ${AUTH_GRPC_HOST:localhost}
      port: ${AUTH_GRPC_PORT:9091}
      deadlineDuration: ${AUTH_GRPC_DEADLINE:3000}

    issue-service:
      host: ${ISSUE_GRPC_HOST:localhost}
      port: ${ISSUE_GRPC_PORT:9094}
      deadlineDuration: ${ISSUE_GRPC_DEADLINE:3000}

    project-service:
      host: ${PROJECT_GRPC_HOST:localhost}
      port: ${PROJECT_GRPC_PORT:9096}
      deadlineDuration: ${PROJECT_GRPC_DEADLINE:3000}

logging:
  level:
    ru.taska: ${GATEWAY_LOG_LEVEL_ROOT:INFO}

app:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:https://taska.ozero.dev}
    allow-credentials: ${GATEWAY_CORS_ALLOW_CREDENTIALS:true}
    allowed-methods: ${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
    allowed-headers: ${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Request-Id,Idempotency-Key}
    exposed-headers: ${GATEWAY_CORS_EXPOSED_HEADERS:X-Request-Id}