server:
  port: ${GATEWAY_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

grpc:
  client:
    auth-service:
      host: ${AUTH_GRPC_HOST:localhost}
      port: ${AUTH_GRPC_PORT:9091}

logging:
  level:
    ru.taska: ${GATEWAY_LOG_LEVEL_ROOT:INFO}