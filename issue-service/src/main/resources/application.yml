server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: issue-service
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9094}
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5436/issue_db}
    username: ${SPRING_R2DBC_USERNAME:taska}
    password: ${SPRING_R2DBC_PASSWORD:taska}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5436/issue_db}
    user: ${SPRING_LIQUIBASE_USERNAME:taska}
    password: ${SPRING_LIQUIBASE_PASSWORD:taska}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    topics:
      issue-events: ${KAFKA_TOPIC_ISSUE_EVENTS:issue.events}
    outbox:
      polling-interval: ${KAFKA_OUTBOX_POLLING_INTERVAL:3s}
      recovery-interval: ${KAFKA_OUTBOX_RECOVERY_INTERVAL:10s}
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${KAFKA_OUTBOX_MAX_ATTEMPTS:5}
      processing-timeout: ${KAFKA_PROCESSING_TIMEOUT:5m}

issue:
  list:
    default-page-size: ${ISSUE_LIST_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${ISSUE_LIST_MAX_PAGE_SIZE:100}
  card:
    max-history-size: ${ISSUE_CARD_MAX_HISTORY_SIZE:50}
  allowed-roles:
    create-issue-roles: ${ISSUE_CREATE_ROLES:ADMIN,MEMBER}
    assign-issue-roles: ${ISSUE_ASSIGN_ROLES:ADMIN,MEMBER}
    delete-issue-roles: ${ISSUE_DELETE_ROLES:ADMIN,MEMBER}
    update-issue-roles: ${ISSUE_UPDATE_ROLES:ADMIN,MEMBER}
    get-issue-roles: ${ISSUE_GET_ROLES:ADMIN,MEMBER,VIEWER}
    list-issue-roles: ${ISSUE_LIST_ROLES:ADMIN,MEMBER,VIEWER}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

grpc:
  client:
    project-service:
      host: ${PROJECT_GRPC_HOST:localhost}
      port: ${PROJECT_GRPC_PORT:9096}

logging:
  level:
    ru.taska: ${LOG_LEVEL_ROOT:INFO}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${LOG_LEVEL_KAFKA:WARN}