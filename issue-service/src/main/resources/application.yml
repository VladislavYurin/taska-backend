server:
  port: ${ISSUE_SERVER_PORT:8084}

spring:
  application:
    name: issue-service
  grpc:
    server:
      port: ${ISSUE_GRPC_SERVER_PORT:9094}
  r2dbc:
    url: ${ISSUE_SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5436/issue_db}
    username: ${ISSUE_SPRING_R2DBC_USERNAME:taska}
    password: ${ISSUE_SPRING_R2DBC_PASSWORD:taska}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${ISSUE_SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5436/issue_db}
    user: ${ISSUE_SPRING_LIQUIBASE_USERNAME:taska}
    password: ${ISSUE_SPRING_LIQUIBASE_PASSWORD:taska}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    topics:
      issue-events: ${ISSUE_KAFKA_TOPIC_ISSUE_EVENTS:issue.events}
    outbox:
      polling-interval: ${ISSUE_KAFKA_OUTBOX_POLLING_INTERVAL:3s}
      recovery-interval: ${ISSUE_KAFKA_OUTBOX_RECOVERY_INTERVAL:10s}
      batch-size: ${ISSUE_KAFKA_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${ISSUE_KAFKA_OUTBOX_MAX_ATTEMPTS:5}
      processing-timeout: ${KAFKA_PROCESSING_OUTBOX_TIMEOUT:5m}

issue:
  list:
    default-page-size: ${ISSUE_LIST_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${ISSUE_LIST_MAX_PAGE_SIZE:100}
  card:
    max-history-size: ${ISSUE_CARD_MAX_HISTORY_SIZE:50}
  allowed-roles:
    create-issue-roles: ${ISSUE_CREATE_ROLES:ADMIN,MEMBER}
    assign-issue-roles: ${ISSUE_ASSIGN_ROLES:ADMIN,MEMBER}
    delete-issue-roles: ${ISSUE_DELETE_ROLES:ADMIN,MEMBER}
    update-issue-roles: ${ISSUE_UPDATE_ROLES:ADMIN,MEMBER}
    issue-transition-roles: ${ISSUE_TRANSITION_ROLES:ADMIN,MEMBER}
    get-issue-roles: ${ISSUE_GET_ROLES:ADMIN,MEMBER,VIEWER}
    list-issue-roles: ${ISSUE_LIST_ROLES:ADMIN,MEMBER,VIEWER}
    create-issue-links-roles: ${ISSUE_LINKS_CREATE_ROLES:ADMIN,MEMBER}
    delete-issue-links-roles: ${ISSUE_LINKS_DELETE_ROLES:ADMIN,MEMBER}
    list-issue-links-roles: ${ISSUE_LINKS_LIST_ROLES:ADMIN,MEMBER,VIEWER}
    upload-attachment-roles: ${ISSUE_UPLOAD_ATTACHMENT_ROLES:ADMIN,MEMBER}
    view-attachment-roles: ${ISSUE_VIEW_ATTACHMENT_ROLES:ADMIN,MEMBER,VIEWER}
    delete-own-attachment-roles: ${ISSUE_DELETE_OWN_ATTACHMENT_ROLES:ADMIN,MEMBER}
    delete-attachment-roles: ${ISSUE_DELETE_ATTACHMENT_ROLES:ADMIN}
    comment-roles: ${ISSUE_COMMENT_ROLES:ADMIN,MEMBER}
    create-project-label-roles: ${ISSUE_CREATE_PROJECT_LABEL_ROLES:ADMIN}
    update-project-label-roles: ${ISSUE_UPDATE_PROJECT_LABEL_ROLES:ADMIN}
    delete-project-label-roles: ${ISSUE_DELETE_PROJECT_LABEL_ROLES:ADMIN}
    list-project-label-roles: ${ISSUE_LIST_PROJECT_LABEL_ROLES:ADMIN,MEMBER,VIEWER}
    add-issue-label-roles: ${ISSUE_ADD_ISSUE_LABEL_ROLES:ADMIN,MEMBER}
    remove-issue-label-roles: ${ISSUE_REMOVE_ISSUE_LABEL_ROLES:ADMIN,MEMBER}
    list-issue-label-roles: ${ISSUE_LIST_ISSUE_LABEL_ROLES:ADMIN,MEMBER,VIEWER}
  idempotency-key-ttl:
    ttl: ${ISSUE_IDEMPOTENCY_TTL:24h}
  retry:
    max-attempts: ${ISSUE_TRANSITION_RETRY_MAX_ATTEMPTS:2}
    min-backoff: ${ISSUE_TRANSITION_RETRY_MIN_BACKOFF:100ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    # Разрешает сбор метрик Prometheus
  metrics:
    tags:
      #Prometheus сразу поймет, от какого сервиса пришли метрики
      application: ${spring.application.name}

grpc:
  client:
    project-service:
      host: ${PROJECT_GRPC_HOST:localhost}
      port: ${PROJECT_GRPC_PORT:9096}
    workflow-service:
      host: ${WORKFLOW_GRPC_HOST:localhost}
      port: ${WORKFLOW_GRPC_PORT:9093}

logging:
  level:
    ru.taska: ${ISSUE_LOG_LEVEL_ROOT:INFO}
    liquibase: ${ISSUE_LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${ISSUE_LOG_LEVEL_KAFKA:WARN}

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://127.0.0.1:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  region: ${MINIO_REGION:us-east-1}
  bucket: ${MINIO_BUCKET_ATTACHMENTS:taska-attachments}
  presigned-url-ttl: ${MINIO_PRESIGNED_URL_TTL:15m}
  max-file-size-bytes: 2097152 # 2 MB
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/webp
    - application/pdf
    - text/plain
    - text/csv
    - text/markdown
    - text/html
    - application/json
    - application/xml
    - text/xml
    - application/x-yaml
    - application/zip