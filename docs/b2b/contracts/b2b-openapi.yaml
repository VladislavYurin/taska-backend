            - required:
              - decisionDueAt
            - required:
              - sendDueAt
        - properties:
            sourceMethod:
              enum:
              - WIRE
          required:
          - feeBearer
          oneOf:
          - required:
            - evidenceCompletedAt
            - businessCalendarId
            - calendarVersion
            - slaPolicyVersion
            - slaSnapshot
            - decisionDueAt
            - sendDueAt
          - not:
              anyOf:
              - required:
                - evidenceCompletedAt
              - required:
                - submittedAt
              - required:
                - businessCalendarId
              - required:
                - calendarVersion
              - required:
                - slaPolicyVersion
              - required:
                - slaSnapshot
              - required:
                - decisionDueAt
              - required:
                - sendDueAt
      description: 'sourceMethod derives from original verified payment, never caller choice. WIRE feeBearer TASKA
        does not deduct principal. First complete evidence freezes WIRE_RETURN_ES_V1 and calendar: decisionDueAt=sendDueAt
        at T+5 business dates excluding evidence date, same Europe/Madrid wall time. Retry/assignment/decision never
        reset the clock; due time does not confirm transfer or promise bank arrival.'
