        slaSnapshot:
          $ref: '#/components/schemas/RefundSlaSnapshot'
        decisionDueAt: *id002
        sendDueAt: *id002
        decidedAt: *id002
        submittedAt: *id002
        feeBearer:
          type: string
          enum:
          - TASKA
      required:
