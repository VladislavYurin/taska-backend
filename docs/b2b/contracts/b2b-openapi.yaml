      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - OPEN
          - WON
          - LOST
          - WITHDRAWN
          - NEEDS_REVIEW
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        version:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        finalOutcome:
          type: string
          enum: &id003
          - WON
          - WITHDRAWN_CONFIRMED
          - LOST_FULL_REFUND
          - LOST_PARTIAL_COVERAGE_REVOKED
        confirmedMoneyFactId: &id004
          type: string
          format: uuid
      required:
      - id
      - tenantId
      - paymentId
      - state
      - openedAt
      - version
      oneOf:
      - properties:
          state:
            enum:
            - OPEN
            - NEEDS_REVIEW
        not:
          anyOf:
          - required:
            - finalOutcome
          - required:
            - resolvedAt
      - properties:
          state:
            enum:
            - WON
          finalOutcome:
            enum:
            - WON
        required:
        - finalOutcome
        - resolvedAt
      - properties:
          state:
            enum:
            - WITHDRAWN
          finalOutcome:
            enum:
            - WITHDRAWN_CONFIRMED
        required:
        - finalOutcome
        - resolvedAt
      - properties:
          state:
            enum:
            - LOST
          finalOutcome:
            enum: &id005
            - LOST_FULL_REFUND
            - LOST_PARTIAL_COVERAGE_REVOKED
        required:
        - finalOutcome
        - confirmedMoneyFactId
        - resolvedAt
      description: NEEDS_REVIEW is nonterminal while evidence remains incomplete. Final partial chargeback is LOST
        with finalOutcome LOST_PARTIAL_COVERAGE_REVOKED and verified source fact. Terminal facts/outcomes are immutable
        and duplicate delivery has no second financial or entitlement effect.
