  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Validated WEB_GLOBAL/WEB_TENANT/PAT/OAUTH credential; x-policy narrows accepted channel. No trust
        in client tenant headers.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: Quoted resource version. Missing 428; stale 412.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Problem:
      description: Typed denial; code/reasons are stable and no private cross-tenant identifiers are disclosed.
        See README HTTP↔gRPC mapping.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
