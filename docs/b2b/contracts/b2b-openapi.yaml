components:
  schemas:
    ErrorCode:
      type: string
      enum:
      - AUTHENTICATION_REQUIRED
      - MFA_REQUIRED
      - TOKEN_REVOKED
      - TENANT_REQUIRED
      - TENANT_MISMATCH
      - TENANT_NOT_FOUND
      - MEMBERSHIP_INACTIVE
      - SCOPE_DENIED
      - SESSION_REQUIRED
      - ADMIN_GRANT_REQUIRED
      - ADMIN_SCOPE_DENIED
      - RESOURCE_NOT_FOUND
      - VERSION_CONFLICT
      - IDEMPOTENCY_CONFLICT
      - QUOTA_EXCEEDED
      - CAPABILITY_DISABLED
      - READ_ONLY
      - OWNER_REQUIRED
      - LAST_ADMIN
      - OWNER_MEMBERSHIP_PROTECTED
      - INVITATION_EXPIRED
      - INVITATION_EMAIL_MISMATCH
      - FREE_ELIGIBILITY_USED
      - PAYMENT_PENDING
      - INVALID_STATE
      - CONFIRMATION_REQUIRED
      - CONFIRMATION_EXPIRED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - POLICY_NOT_CONFIGURED
      - VALIDATION_FAILED
    RestrictionCode:
      type: string
      enum:
      - PAYMENT_EXPIRED
      - OVER_QUOTA
      - OWNER_PAUSE
      - PLATFORM_BLOCK
      - PAYMENT_DISPUTE
      - PENDING_FIRST_PAYMENT
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - field
      - code
      - message
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 300
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
          format: uuid
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RestrictionCode'
          maxItems: 20
        violations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
          maxItems: 50
      required:
      - type
      - title
      - status
      - code
      - requestId
      - reasons
    ConfirmedAction:
      type: object
      additionalProperties: false
      properties:
        confirmed:
          type: boolean
          enum:
          - true
      required:
      - confirmed
    Operation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          minLength: 1
          maxLength: 64
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - MANUAL_REVIEW
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        failureCode:
          $ref: '#/components/schemas/ErrorCode'
      required:
      - id
      - type
      - state
      - createdAt
      - updatedAt
    Money:
      type: object
      additionalProperties: false
      properties:
        amountMinor:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        currency:
          type: string
          enum:
          - EUR
          - USD
        exponent:
          type: integer
          minimum: 0
          maximum: 4
          enum:
          - 2
      required:
      - amountMinor
      - currency
      - exponent
      description: Unsigned minor units as decimal string; EUR/USD exponent=2. Signed ledger delta is separate;
        never float money.
    FxQuote:
      type: object
      additionalProperties: false
      properties:
        baseCurrency:
          type: string
          enum:
          - EUR
        quoteCurrency:
          type: string
          enum:
          - USD
        rate:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[0-9]+(\.[0-9]{1,18})?$
        source:
          type: string
          minLength: 1
          maxLength: 100
        observedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
      - baseCurrency
      - quoteCurrency
      - rate
      - source
      - observedAt
      - expiresAt
    QuotaLimit:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - SEAT
          - PROJECT
          - STORAGE_BYTES
          - TASK_LIFETIME
        limit:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        unlimited:
          type: boolean
      required:
      - kind
      - unlimited
      description: unlimited=true requires absence of limit; unlimited=false requires limit.
      oneOf:
      - properties:
          unlimited:
            enum:
            - false
        required:
        - limit
      - properties:
          unlimited:
            enum:
            - true
        not:
          required:
          - limit
    QuotaUsage:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - SEAT
          - PROJECT
          - STORAGE_BYTES
          - TASK_LIFETIME
        used:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        reserved:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        limit:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        unlimited:
          type: boolean
        projectId:
          type: string
          format: uuid
        version:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
      required:
      - kind
      - used
      - reserved
      - unlimited
      - version
      oneOf:
      - properties:
          unlimited:
            enum:
            - false
        required:
        - limit
      - properties:
          unlimited:
            enum:
            - true
        not:
          required:
          - limit
