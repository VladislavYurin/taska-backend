            - SUBSCRIPTION_FULL
          reasonCode:
            enum:
            - BILLING_ERROR
            - SERVICE_FAILURE
            - MANDATORY
      - properties:
          kind:
            enum:
            - UNALLOCATED_RETURN
          reasonCode:
            enum:
            - EXCESS
            - LATE_FIRST_PAYMENT
            - CLOSED_CREATION
            - INCOMPLETE_BANK_PAYMENT
            - DUPLICATE_PAYMENT
      allOf:
      - oneOf:
        - properties:
            sourceMethod:
