      - id
      - source
      - sourceReference
      - amount
      - observedAt
      - state
      - unallocated
      - occurredPrecision
      - matchedUnallocated
      - providerAccountId
      oneOf:
      - properties:
          occurredPrecision:
            enum:
            - EXACT
          occurredAt:
            type: string
            format: date-time
        required:
        - occurredAt
        not:
          anyOf:
          - required:
            - occurredNotBefore
          - required:
            - occurredBefore
      - properties:
          occurredPrecision:
            enum:
            - DAY
          occurredAt:
            type: string
            nullable: true
            enum:
            - null
        required:
        - occurredNotBefore
        - occurredBefore
      description: EXACT has verified occurredAt and no range. DAY has occurredAt absent/null and verified half-open
        [occurredNotBefore,occurredBefore), never fabricated exact midnight; before>notBefore is a domain invariant.
        Boundary overlap stays MANUAL_REVIEW. payerRef is verified opaque payer identity, never bank credentials/raw
        statement.
      allOf:
      - oneOf:
        - properties:
            source:
              enum:
              - WIRE
          required:
          - payerRef
        - properties:
            source:
              enum:
              - PSP
