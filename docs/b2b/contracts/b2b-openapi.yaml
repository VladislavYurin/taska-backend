          type: string
          format: uuid
        state:
          type: string
          enum:
          - OBSERVED
          - CONFIRMED
          - REJECTED
          - MANUAL_REVIEW
        invoiceId:
          type: string
          format: uuid
        unallocated:
          $ref: '#/components/schemas/Money'
          description: Total amount not finally allocated, including matchedUnallocated; pending matching is not
            coverage.
        occurredPrecision:
          $ref: '#/components/schemas/OccurrencePrecision'
        occurredAt:
          type: string
          format: date-time
          nullable: true
        occurredNotBefore:
          type: string
          format: date-time
        occurredBefore:
          type: string
          format: date-time
        payerRef:
          type: string
          minLength: 1
          maxLength: 200
        matchedUnallocated:
          $ref: '#/components/schemas/Money'
        providerAccountId:
          type: string
          minLength: 1
          maxLength: 200
