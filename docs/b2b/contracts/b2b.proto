  string id = 1;
  SourceValue source = 2;
  string source_reference = 3;
  Money amount = 4;
  reserved 5;
  reserved "received_at";
  string observed_at = 6;
  optional string confirmed_at = 7;
  optional string confirmed_by = 8;
  StateValue state = 9;
  optional string invoice_id = 10;
  Money unallocated = 11;
  OccurrencePrecision occurred_precision = 12;
  optional string occurred_at = 13;
  optional string occurred_not_before = 14;
  optional string occurred_before = 15;
  optional string payer_ref = 16;
