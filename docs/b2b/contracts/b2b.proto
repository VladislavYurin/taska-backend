message ResolveTenantAccessRequest { RequestContext context = 1; string target_tenant_id = 2; string action = 3; optional string project_id = 4; }
message TenantAccessDecision { bool allowed = 1; repeated ErrorCode denial_codes = 2; string membership_version = 3; string owner_id = 4; }
message GetEntitlementSnapshotRequest { RequestContext context = 1; string tenant_id = 2; optional string minimum_version = 3; }
message B2bErrorDetail { ErrorCode code = 1; repeated RestrictionCode reasons = 2; repeated FieldViolation violations = 3; string request_id = 4; bool retryable = 5; }
// gRPC non-OK status + serialized B2bErrorDetail trailer, never a success response containing an error.
message ObservePaymentRpcRequest { RequestContext context = 1; VerifiedPaymentObservation observation = 2; }
service PaymentIngressService { rpc ObserveVerifiedPayment(ObservePaymentRpcRequest) returns (PaymentObservationResult); }
service QuotaAuthorityService {
 rpc ReserveQuota(ReserveQuotaRpcRequest) returns (QuotaReservation);
 rpc CommitQuota(FinalizeQuotaRpcRequest) returns (QuotaReservation);
 rpc ReleaseQuota(FinalizeQuotaRpcRequest) returns (QuotaReservation);
}
service TenantAccessService { rpc ResolveTenantAccess(ResolveTenantAccessRequest) returns (TenantAccessDecision); }
service EntitlementService { rpc GetEntitlementSnapshot(GetEntitlementSnapshotRequest) returns (Entitlement); }

service TenantService {
  rpc CreateTenant(CreateTenantRpcRequest) returns (CreateTenantResponse);
  rpc ListTenants(ListTenantsRpcRequest) returns (TenantPage);
  rpc GetTenant(GetTenantRpcRequest) returns (Tenant);
  rpc RenameTenant(RenameTenantRpcRequest) returns (Tenant);
  rpc CancelTenantCreation(CancelTenantCreationRpcRequest) returns (Tenant);
  rpc PauseTenant(PauseTenantRpcRequest) returns (Tenant);
  rpc ResumeTenant(ResumeTenantRpcRequest) returns (Tenant);
  rpc TransferTenantOwnership(TransferTenantOwnershipRpcRequest) returns (Tenant);
  rpc ListTenantMembers(ListTenantMembersRpcRequest) returns (MembershipPage);
  rpc SetTenantMemberRole(SetTenantMemberRoleRpcRequest) returns (Membership);
  rpc SetTenantMemberState(SetTenantMemberStateRpcRequest) returns (Membership);
  rpc RemoveTenantMember(RemoveTenantMemberRpcRequest) returns (Operation);
  rpc LeaveTenant(LeaveTenantRpcRequest) returns (Operation);
  rpc ListTenantInvitations(ListTenantInvitationsRpcRequest) returns (InvitationPage);
  rpc CreateTenantInvitation(CreateTenantInvitationRpcRequest) returns (Invitation);
  rpc ResendTenantInvitation(ResendTenantInvitationRpcRequest) returns (Invitation);
  rpc RevokeTenantInvitation(RevokeTenantInvitationRpcRequest) returns (google.protobuf.Empty);
  rpc PreviewTenantInvitation(PreviewTenantInvitationRpcRequest) returns (InvitationPreview);
  rpc AcceptTenantInvitation(AcceptTenantInvitationRpcRequest) returns (InvitationAcceptance);
  rpc GetTenantQuotas(GetTenantQuotasRpcRequest) returns (QuotaSnapshot);
  rpc GetTenantCapabilities(GetTenantCapabilitiesRpcRequest) returns (Capabilities);
  rpc GetTenantOperation(GetTenantOperationRpcRequest) returns (Operation);
  rpc CreateTenantExport(CreateTenantExportRpcRequest) returns (Export);
  rpc GetTenantExport(GetTenantExportRpcRequest) returns (Export);
  rpc DownloadTenantExport(DownloadTenantExportRpcRequest) returns (stream DownloadChunk);
  rpc CreateTenantDeletionChallenge(CreateTenantDeletionChallengeRpcRequest) returns (ConfirmationChallenge);
  rpc DeleteTenant(DeleteTenantRpcRequest) returns (Operation);
}

service AccountService {
  rpc StartWebSession(StartWebSessionRpcRequest) returns (LoginResult);
  rpc RefreshWebSession(RefreshWebSessionRpcRequest) returns (AccessSession);
