  enum StateValue { STATE_UNSPECIFIED = 0; STATE_REQUESTED = 1; STATE_APPROVED = 2; STATE_SUBMITTING = 3; STATE_UNKNOWN = 4; STATE_CONFIRMED = 5; STATE_FAILED = 6; STATE_REJECTED = 7; }
  string id = 1;
  string tenant_id = 2;
