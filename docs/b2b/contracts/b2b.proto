message GetProjectTaskQuotaRpcRequest { RequestContext context = 1; string tenant_id = 2; string project_id = 3; }
service ProjectQuotaReadService { rpc GetProjectTaskQuota(GetProjectTaskQuotaRpcRequest) returns (QuotaUsage); }

enum OccurrencePrecision { OCCURRENCE_PRECISION_UNSPECIFIED = 0; OCCURRENCE_PRECISION_EXACT = 1; OCCURRENCE_PRECISION_DAY = 2; }
enum RefundReasonCode {
 REFUND_REASON_CODE_UNSPECIFIED = 0;
 REFUND_REASON_CODE_BILLING_ERROR = 1;
 REFUND_REASON_CODE_SERVICE_FAILURE = 2;
 REFUND_REASON_CODE_MANDATORY = 3;
 REFUND_REASON_CODE_EXCESS = 4;
 REFUND_REASON_CODE_LATE_FIRST_PAYMENT = 5;
 REFUND_REASON_CODE_CLOSED_CREATION = 6;
 REFUND_REASON_CODE_INCOMPLETE_BANK_PAYMENT = 7;
 REFUND_REASON_CODE_DUPLICATE_PAYMENT = 8;
}
message ConsentSnapshot {
 enum ConsentChannelValue { CONSENT_CHANNEL_UNSPECIFIED = 0; CONSENT_CHANNEL_WEB = 1; CONSENT_CHANNEL_PAT = 2; CONSENT_CHANNEL_OAUTH = 3; CONSENT_CHANNEL_MCP = 4; }
 string owner_id = 1;
 string owner_version = 2;
 string actor_user_id = 3;
 string consent_terms_version = 4;
 string consent_terms_sha256 = 5;
 ConsentChannelValue consent_channel = 6;
 CredentialKind credential_kind = 7;
 string payment_method_id = 8;
 string consented_at = 9;
 string request_id = 10;
}

message FinancialEvidenceRefinementRequest {
 string evidence_ref = 1;
 string digest = 2;
 OccurrencePrecision occurred_precision = 3;
 optional string occurred_at = 4;
 optional string occurred_not_before = 5;
 optional string occurred_before = 6;
 string payer_ref = 7;
 bool confirmed = 8;
}
message FinancialEvidenceRefinement {
 string evidence_id = 1;
 string source_fact_id = 2;
 string evidence_ref = 3;
 string digest = 4;
 OccurrencePrecision occurred_precision = 5;
 optional string occurred_at = 6;
 optional string occurred_not_before = 7;
 optional string occurred_before = 8;
 string payer_ref = 9;
 string verified_by = 10;
 string verified_at = 11;
}
message AppendWireEvidenceRefinementRpcRequest { RequestContext context = 1; string payment_id = 2; FinancialEvidenceRefinementRequest payload = 3; MutationOptions mutation = 4; }
service PaymentEvidenceService { rpc AppendWireEvidenceRefinement(AppendWireEvidenceRefinementRpcRequest) returns (FinancialEvidenceRefinement); }

message RecordUnmatchedWireReceiptRequest {
 string bank_reference = 1; string provider_account_id = 2; Money amount = 3;
 string evidence_reference = 4; string evidence_digest = 5; OccurrencePrecision occurred_precision = 6;
 optional string occurred_at = 7; optional string occurred_not_before = 8; optional string occurred_before = 9;
 optional string payer_ref = 10;
}
message UnmatchedWireReceipt {
 enum StateValue { STATE_UNSPECIFIED = 0; STATE_UNMATCHED = 1; STATE_ASSIGNED = 2; STATE_RETURN_PENDING = 3; STATE_RETURNED = 4; STATE_POLICY_HOLD = 5; }
 string id = 1; StateValue state = 2; string bank_reference = 3; string provider_account_id = 4;
 Money amount = 5; string evidence_reference = 6; string evidence_digest = 7;
 OccurrencePrecision occurred_precision = 8; optional string occurred_at = 9;
 optional string occurred_not_before = 10; optional string occurred_before = 11;
 optional string payer_ref = 12; string observed_at = 13; optional string assigned_tenant_id = 14; optional string payment_fact_id = 15;
}
message UnmatchedWireReceiptPage { repeated UnmatchedWireReceipt items = 1; optional string next_cursor = 2; }
message AssignUnmatchedWireReceiptRequest { string invoice_id = 1; string payer_ref = 2; string evidence_reference = 3; string evidence_digest = 4; bool confirmed = 5; }
message ListUnmatchedWireReceiptsRpcRequest { RequestContext context = 1; PageRequest page = 2; }
message RecordUnmatchedWireReceiptRpcRequest { RequestContext context = 1; RecordUnmatchedWireReceiptRequest payload = 2; MutationOptions mutation = 3; }
message AssignUnmatchedWireReceiptRpcRequest { RequestContext context = 1; string receipt_id = 2; AssignUnmatchedWireReceiptRequest payload = 3; MutationOptions mutation = 4; }
service UnmatchedWireReceiptService {
 rpc ListUnmatchedWireReceipts(ListUnmatchedWireReceiptsRpcRequest) returns (UnmatchedWireReceiptPage);
 rpc RecordUnmatchedWireReceipt(RecordUnmatchedWireReceiptRpcRequest) returns (UnmatchedWireReceipt);
 rpc AssignUnmatchedWireReceipt(AssignUnmatchedWireReceiptRpcRequest) returns (PaymentFact);
}

message RefundSlaSnapshot {
 enum FeeBearerValue { FEE_BEARER_UNSPECIFIED = 0; FEE_BEARER_TASKA = 1; }
 enum CountingRuleValue { COUNTING_RULE_UNSPECIFIED = 0; COUNTING_RULE_T_PLUS_5_BUSINESS_DATES_SAME_LOCAL_TIME = 1; }
 enum DstGapRuleValue { DST_GAP_RULE_UNSPECIFIED = 0; DST_GAP_RULE_NEXT_VALID_INSTANT = 1; }
 enum DstOverlapRuleValue { DST_OVERLAP_RULE_UNSPECIFIED = 0; DST_OVERLAP_RULE_LATER_OFFSET = 1; }
 uint32 business_days = 1; // exactly 5
 FeeBearerValue fee_bearer = 2;
 CountingRuleValue counting_rule = 3;
 string timezone = 4; // Europe/Madrid
 string calendar_digest = 5;
 bool exclude_evidence_date = 6; // true
 DstGapRuleValue dst_gap_rule = 7;
 DstOverlapRuleValue dst_overlap_rule = 8;
}

// TAS-311 internal authority: state only, no directory/credentials or mutation APIs.
message MembershipSnapshot {
  string tenant_id = 1;
  string user_id = 2;
  Membership.RoleValue role = 3;
  Membership.StateValue state = 4;
  string version = 5;
  string tenant_membership_version = 6;
  bool is_owner = 7;
  string joined_at = 8;
}
message GetMembershipRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  string user_id = 3;
}
message BatchValidateMembershipsRpcRequest {
  RequestContext context = 1;
  string tenant_id = 2;
  repeated string user_ids = 3; // 1..100 distinct canonical UUIDs, same tenant.
}
message MembershipValidation {
  string user_id = 1;
  bool found = 2;
  optional MembershipSnapshot membership = 3;
}
message MembershipValidationBatch {
  string tenant_id = 1;
  string tenant_membership_version = 2;
  repeated MembershipValidation items = 3; // Same order as requested user_ids.
  Tenant.LifecycleValue tenant_lifecycle = 4;
}
service TenantMembershipService {
  rpc GetMembership(GetMembershipRpcRequest) returns (MembershipSnapshot);
  rpc BatchValidateMemberships(BatchValidateMembershipsRpcRequest) returns (MembershipValidationBatch);
}

// Internal current-offer lookup for tenant provisioning; historical invoice/period references remain stored unchanged.
message ResolvePublishedPlanRpcRequest { RequestContext context = 1; string plan_version_id = 2; }
