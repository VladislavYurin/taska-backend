  enum StateValue { STATE_UNSPECIFIED = 0; STATE_NEW = 1; STATE_PROCESSING = 2; STATE_UNKNOWN = 3; STATE_SUCCEEDED = 4; STATE_FAILED = 5; }
  bool duplicate = 1;
  optional string payment_fact_id = 2;
  string operation_id = 3;
  StateValue state = 4;
