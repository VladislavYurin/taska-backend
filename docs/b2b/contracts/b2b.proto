  string provider_id = 1;
  string event_id = 2;
  string external_payment_id = 3;
  string invoice_id = 4;
  Money amount = 5;
  string occurred_at = 6;
  string observed_at = 7;
  StatusValue status = 8;
  string evidence_digest = 9;
