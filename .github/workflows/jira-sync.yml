name: Jira sync

on:
  pull_request:
    # synchronize and edited catch a PR whose opened event was missed (GitHub
    # skips runs while a PR conflicts) or whose key was added to the title later.
    types: [ opened, reopened, ready_for_review, synchronize, edited, closed ]

permissions:
  contents: read

concurrency:
  group: jira-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Jira issue status
    runs-on: ubuntu-latest
    if: >-
      vars.JIRA_SYNC_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # The same commit this workflow file was read from (the PR merge commit,
      # or the base branch merge commit once merged), so the script always
      # matches the workflow, even for branches cut before it existed.
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Update the Jira issue
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USERNAME: ${{ vars.JIRA_USERNAME }}
          JIRA_PROJECT_KEYS: ${{ vars.JIRA_PROJECT_KEYS || 'TAS' }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_STATUS_IN_REVIEW: ${{ vars.JIRA_STATUS_IN_REVIEW || 'In Review' }}
          JIRA_STATUS_DONE: ${{ vars.JIRA_STATUS_DONE || 'Done' }}
          JIRA_DONE_BRANCHES: ${{ vars.JIRA_DONE_BRANCHES || 'develop,main,master' }}
        with:
          script: |
            const script = './.github/codex/scripts/jira-sync.js';
            if (!require('fs').existsSync(script)) {
              core.warning(`${script} is missing in this commit; Jira is not updated.`);
              return;
            }
            const syncJiraIssue = require(script);
            await syncJiraIssue({ context, core });
