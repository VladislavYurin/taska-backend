name: PR CI (Taska backend)

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write  # нужно для push в GHCR

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  PR_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  observability-config:
    name: Check log environment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment file
        run: cp .env.docker.example .env
      - name: Test Compose and Grafana configuration
        run: |
          node --test infra/tests/*.test.js
          python3 -m unittest discover -s infra/pgadmin -p 'test_*.py'
      - name: Test pgAdmin startup with an existing volume
        run: PGADMIN_CONTAINER_TEST=1 python3 -m unittest discover -s infra/pgadmin -p 'test_container_startup.py'
      - name: Validate Promtail config for local and stage
        run: |
          for environment in local stage; do
            docker run --rm -e DEPLOY_ENVIRONMENT="$environment" \
              -v "$PWD/infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro" \
              grafana/promtail:3.6.11 -config.file=/etc/promtail/config.yml -config.expand-env=true -check-syntax
          done

  java-build:
    name: Build & Test — ${{ matrix.mod.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Должны совпадать с <modules> в корневом pom.xml
        mod:
          - { name: common-lib,          module: common-lib }
          - { name: grpc-common-lib,     module: grpc-common-lib }
          - { name: kafka-lib,           module: kafka-lib }
          - { name: api-gateway,         module: api-gateway }
          - { name: auth-service,        module: auth-service }
          - { name: project-service,     module: project-service }
          - { name: workflow-service,    module: workflow-service }
          - { name: issue-service,       module: issue-service }
          - { name: notification-service,module: notification-service }
          - { name: admin-service,       module: admin-service }
          - { name: mcp-server,          module: mcp-server }
          - { name: oauth-server,        module: oauth-server }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp -pl ${{ matrix.mod.module }} -am clean verify

      - name: MCP client security integration
        if: matrix.mod.module == 'mcp-server'
        run: mvn -B -ntp -pl mcp-server -am test -Dtest=McpClientSecurityIT -Dsurefire.failIfNoSpecifiedTests=false

      - name: Board column cursor PostgreSQL contract
        if: matrix.mod.module == 'issue-service'
        run: >-
          mvn -B -ntp -pl issue-service -am test
          -Dtest=ListIssuesForBoardIT
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Auth invitation block/unblock integration
        if: matrix.mod.module == 'auth-service'
        run: mvn -B -ntp -pl auth-service -am test -Dtest=InvitedUnblockIT -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.mod.name }}
          path: |
            ${{ matrix.mod.module }}/target/surefire-reports/*
            ${{ matrix.mod.module }}/target/failsafe-reports/*

      - name: Upload JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.mod.name }}
          path: |
            ${{ matrix.mod.module }}/target/site/jacoco/*
            ${{ matrix.mod.module }}/target/jacoco*.xml
            ${{ matrix.mod.module }}/target/jacoco.xml

  docker-build:
    name: Build Docker — ${{ matrix.svc.name }}
    runs-on: ubuntu-latest
    needs: java-build
    # Включаем сборку образов только если на PR есть label "docker"
    if: contains(github.event.pull_request.labels.*.name, 'docker')
    strategy:
      fail-fast: false
      matrix:
        svc:
          - { name: api-gateway,          module: api-gateway,          img: api-gateway }
          - { name: mcp-server,           module: mcp-server,           img: mcp-server }
          - { name: oauth-server,         module: oauth-server,         img: oauth-server }
          - { name: auth-service,         module: auth-service,         img: auth-service }
          - { name: project-service,      module: project-service,      img: project-service }
          - { name: workflow-service,     module: workflow-service,     img: workflow-service }
          - { name: issue-service,        module: issue-service,        img: issue-service }
          - { name: notification-service, module: notification-service, img: notification-service }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.svc.img }}
          tags: |
            type=raw,value=${{ env.PR_TAG }}
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          # ВАЖНО: context должен быть корень репозитория (multi-module сборка)
          context: .
          file: ${{ matrix.svc.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max