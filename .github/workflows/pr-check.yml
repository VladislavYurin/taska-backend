name: PR CI (Taska backend)

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write  # нужно для push в GHCR

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  PR_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  java-build:
    name: Build & Test — ${{ matrix.mod.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Должны совпадать с <modules> в корневом pom.xml
        mod:
          - { name: common-lib,          module: common-lib }
          - { name: kafka-lib,           module: kafka-lib }
          - { name: api-gateway,         module: api-gateway }
          - { name: auth-service,        module: auth-service }
          - { name: project-service,     module: project-service }
          - { name: workflow-service,    module: workflow-service }
          - { name: issue-service,       module: issue-service }
          - { name: notification-service,module: notification-service }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp -pl ${{ matrix.mod.module }} -am clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.mod.name }}
          path: |
            ${{ matrix.mod.module }}/target/surefire-reports/*
            ${{ matrix.mod.module }}/target/failsafe-reports/*

      - name: Upload JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.mod.name }}
          path: |
            ${{ matrix.mod.module }}/target/site/jacoco/*
            ${{ matrix.mod.module }}/target/jacoco*.xml
            ${{ matrix.mod.module }}/target/jacoco.xml

  docker-build:
    name: Build Docker — ${{ matrix.svc.name }}
    runs-on: ubuntu-latest
    needs: java-build
    # Включаем сборку образов только если на PR есть label "docker"
    if: contains(github.event.pull_request.labels.*.name, 'docker')
    strategy:
      fail-fast: false
      matrix:
        svc:
          - { name: api-gateway,          module: api-gateway,          img: api-gateway }
          - { name: auth-service,         module: auth-service,         img: auth-service }
          - { name: project-service,      module: project-service,      img: project-service }
          - { name: workflow-service,     module: workflow-service,     img: workflow-service }
          - { name: issue-service,        module: issue-service,        img: issue-service }
          - { name: notification-service, module: notification-service, img: notification-service }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.svc.img }}
          tags: |
            type=raw,value=${{ env.PR_TAG }}
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          # ВАЖНО: context должен быть корень репозитория (multi-module сборка)
          context: .
          file: ${{ matrix.svc.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max