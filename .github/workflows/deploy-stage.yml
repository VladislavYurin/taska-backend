name: Deploy stage to Dokploy

on:
  push:
    branches: [develop]

permissions:
  contents: read

# Джоба ждёт окончания деплоя, поэтому деплои идут строго по одному,
# а серия мержей схлопывается: GitHub держит в группе только один pending-запуск
concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Секреты лежат в environment "stage", куда пускают только ветку develop
    environment: stage

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}

    # Репозиторий публичный, логи Actions видны всем:
    # не выводить ответ compose.one и не включать set -x — в env лежат секреты стенда
    steps:
      - name: Set GIT_COMMIT in Dokploy
        shell: bash
        run: |
          set -euo pipefail

          for SECRET_NAME in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!SECRET_NAME:-}" ]; then
              echo "::error::${SECRET_NAME} is not set"
              exit 1
            fi
          done

          BASE_URL="${DOKPLOY_URL%/}"

          CURRENT_ENV=$(curl -fsS --max-time 30 --retry 3 \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              "${BASE_URL}/api/compose.one?composeId=${DOKPLOY_COMPOSE_ID}" \
            | jq -r '.env // ""')

          # saveEnvironment перезаписывает env целиком: пустой ответ затёр бы всю конфигурацию стенда
          if [ -z "${CURRENT_ENV//[[:space:]]/}" ]; then
            echo "::error::Dokploy вернул пустой env, перезапись отменена"
            exit 1
          fi

          NEW_ENV="$(printf '%s\n' "$CURRENT_ENV" | sed '/^GIT_COMMIT=/d')"$'\n'"GIT_COMMIT=${GITHUB_SHA}"

          jq -n --arg composeId "$DOKPLOY_COMPOSE_ID" --arg env "$NEW_ENV" \
              '{composeId: $composeId, env: $env, createEnvFile: true}' \
            | curl -sS --fail-with-body --max-time 30 \
                -X POST "${BASE_URL}/api/compose.saveEnvironment" \
                -H "x-api-key: ${DOKPLOY_API_KEY}" \
                -H "Content-Type: application/json" \
                --data @-
          echo

          echo "GIT_COMMIT updated to ${GITHUB_SHA}"

      - name: Deploy and wait for result
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${DOKPLOY_URL%/}"
          TITLE="GitHub deploy ${GITHUB_SHA:0:7} #${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          jq -n --arg composeId "$DOKPLOY_COMPOSE_ID" --arg title "$TITLE" \
              '{composeId: $composeId, title: $title}' \
            | curl -sS --fail-with-body --max-time 30 \
                -X POST "${BASE_URL}/api/compose.deploy" \
                -H "x-api-key: ${DOKPLOY_API_KEY}" \
                -H "Content-Type: application/json" \
                --data @-
          echo

          # compose.deploy только ставит задачу в очередь,
          # запись deployment появляется, когда воркер Dokploy её забирает
          DEPLOYMENT_ID=""
          MISSING_POLLS=0
          for _ in $(seq 1 150); do
            if ! DEPLOYMENTS=$(curl -fsS --max-time 30 \
                --retry 3 --retry-delay 2 --retry-all-errors \
                -H "x-api-key: ${DOKPLOY_API_KEY}" \
                "${BASE_URL}/api/deployment.allByCompose?composeId=${DOKPLOY_COMPOSE_ID}"); then
              echo "::warning::Failed to query Dokploy deployments; retrying on the next poll"
              sleep 10
              continue
            fi

            # Pin one record as soon as the worker creates it. Never switch to
            # another record during subsequent polls.
            if [ -z "$DEPLOYMENT_ID" ]; then
              DEPLOYMENT_ID=$(jq -r --arg t "$TITLE" \
                '[.[] | select(.title == $t)] | sort_by(.createdAt) | last | .deploymentId // empty' \
                <<<"$DEPLOYMENTS")
            fi

            if [ -z "$DEPLOYMENT_ID" ]; then
              STATUS="queued"
            else
              STATUS=$(jq -r --arg id "$DEPLOYMENT_ID" \
                '.[] | select(.deploymentId == $id) | .status' <<<"$DEPLOYMENTS" | head -n 1)

              if [ -z "$STATUS" ]; then
                MISSING_POLLS=$((MISSING_POLLS + 1))
                STATUS="missing"
              else
                MISSING_POLLS=0
              fi
            fi

            echo "$(date +%T) ${STATUS}"
            case "$STATUS" in
              done) exit 0 ;;
              error|cancelled)
                echo "::error::Деплой в Dokploy завершился со статусом ${STATUS}"
                exit 1
                ;;
              missing)
                if [ "$MISSING_POLLS" -ge 3 ]; then
                  echo "::error::Dokploy deployment ${DEPLOYMENT_ID} disappeared from the API"
                  exit 1
                fi
                ;;
            esac
            sleep 10
          done

          echo "::error::Не дождались завершения деплоя"
          exit 1
