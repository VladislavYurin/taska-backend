server:
  port: 8082

spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5434/project_db}
    username: ${SPRING_R2DBC_USERNAME:taska}
    password: ${SPRING_R2DBC_PASSWORD:taska}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}
  liquibase:
    enabled: true
    url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5434/project_db}
    user: ${SPRING_R2DBC_USERNAME:taska}
    password: ${SPRING_R2DBC_PASSWORD:taska}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

outbox:
  scheduler-delay: ${SCHEDULER_DELAY:5000}
  recovery-interval: ${RECOVERY_INTERVAL:10000}
  topic: ${OUTBOX_TOPIC:project.events}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  processing-timeout-seconds: ${PROCESSING_TIMEOUT:300}

logging:
  level:
    ru.taska: ${LOG_LEVEL_ROOT:INFO}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${LOG_LEVEL_KAFKA:WARN}