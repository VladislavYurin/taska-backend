server:
  port: ${PROJECT_SERVER_PORT:8082}

spring:
  application:
    name: project-service
  grpc:
    server:
      port: ${PROJECT_GRPC_SERVER_PORT:9096}
  r2dbc:
    url: ${PROJECT_SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5434/project_db}
    username: ${PROJECT_SPRING_R2DBC_USERNAME:taska}
    password: ${PROJECT_SPRING_R2DBC_PASSWORD:taska}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    url: ${PROJECT_SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5434/project_db}
    user: ${PROJECT_SPRING_LIQUIBASE_USERNAME:taska}
    password: ${PROJECT_SPRING_LIQUIBASE_PASSWORD:taska}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

app:
  kafka:
    topics:
      project-events: ${PROJECT_KAFKA_TOPIC_PROJECT_EVENTS:project.events}
    outbox:
      polling-interval: ${PROJECT_KAFKA_OUTBOX_POLLING_INTERVAL:3s}
      recovery-interval: ${PROJECT_KAFKA_OUTBOX_RECOVERY_INTERVAL:10s}
      batch-size: ${PROJECT_KAFKA_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${PROJECT_KAFKA_OUTBOX_MAX_ATTEMPTS:5}
      processing-timeout: ${PROJECT_KAFKA_OUTBOX_PROCESSING_TIMEOUT:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    # Разрешает сбор метрик Prometheus
  metrics:
    tags:
      #Prometheus сразу поймет, от какого сервиса пришли метрики
      application: ${spring.application.name}

logging:
  level:
    ru.taska: ${PROJECT_LOG_LEVEL_ROOT:INFO}
    liquibase: ${PROJECT_LOG_LEVEL_LIQUIBASE:INFO}
    org.apache.kafka: ${PROJECT_LOG_LEVEL_KAFKA:WARN}